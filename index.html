  button.danger { background:#3a1d1d; color:#ff9b8a; border-color:#7a3a34; font-weight:600; }

  .lv { padding:11px 0; font-size:14px; border-radius:8px; border:1px solid #2c3648;

  .lv.done { border-color:#3d5a3d; color:#7fbf7f; }

  .row { display:flex; align-items:center; gap:10px; font-size:13px; color:#8b98a9; margin-bottom:14px; }
  input[type=range] { flex:1; accent-color:#e6c15a; }
  .note { font-size:11px; color:#6b7684; line-height:1.6; margin-top:14px; }

const FRICTION = { '.': 0.75, '@': 0.75, 'X': 0.75, 'O': 0.75, '~': 0.04, ':': 6.0, '#': 0.75 };

/* ⚠⚠ 滑 = 失速。這是 v8 的核心修正，前面五版全部搞錯方向。
 *
 * 錯誤史：v2 只調摩擦 → v3~v6 等比例削弱操控權威 → v7 削弱轉向能力。
 * 每一版測試都全綠，每一版實測都是「一點都不滑」。Gary 一句話點破：「滑不就是要失速嗎？」
 *
 * 根本錯誤：我把 Mario 的冰面模型硬套過來。**Mario 用腳推地面，冰上會打滑，所以推力該打折；
 * 但這裡的球是被重力推的，地面材質不影響重力分量。** v7 把冰上 DRIVE 砍到 0.45，
 * 等於讓球在冰上「推不動、加速慢」—— 那是沙的感覺，正好是冰的反面。
 *
 * 對「重力驅動的球」，冰的唯一正確效果就是**摩擦趨近於零**：
 *   → 球一路加速、放手也不減速、速度越堆越高 → 剎車距離暴增 → 失控
 * 難度是速度自己長出來的，不需要人為削弱操控。
 *   DRIVE = 沿速度方向的加速度倍率、TURN = 垂直方向（轉彎）的倍率，冰上都保持接近 1。
 */
const DRIVE = { '.': 1.0, '@': 1.0, 'X': 1.0, 'O': 1.0, '~': 1.00, ':': 0.80, '#': 1.0 };
const TURN  = { '.': 1.0, '@': 1.0, 'X': 1.0, 'O': 1.0, '~': 0.85, ':': 0.85, '#': 1.0 };

/* ══════════════ 狀態 ══════════════ */
let state = 'menu';           // menu | playing | falling | cleared | finished | paused
let level = 0;                // 0-based
let grid = null;              // 當前關卡（字串陣列）
let ball = { x: 1.5, y: 1.5, vx: 0, vy: 0 };
let startCell = { c: 1, r: 1 };
let goalCell = { c: 13, r: 13 };
let elapsed = 0;              // 本關計時
let fails = 0;                // 本關失誤
let anim = 0;                 // 動畫計時
let fallAt = null;            // 掉入的洞座標（動畫用）
let accumulator = 0;
let spin = 0;                 // 球的滾動相位（弧度），讓球看得出在滾而不是在滑
let spinX = 1, spinY = 0;     // 滾動方向
let lastWallSfx = 0;          // 撞牆音效節流（球沿牆滑會連續觸發）
let terrainNow = '.';         // 球目前踩的地形，用來偵測「踏上／離開」並給回饋
let shake = 0;                // 掉洞時的畫面震動（juice：不改規則，只改體驗）
let flash = 0;                // 過關閃光
let nameShow = 0;             // 關卡主題提示的殘餘秒數
let tiltX = 0, tiltY = 0;             // 實際套用的傾斜 -1..1
let targetTiltX = 0, targetTiltY = 0; // 輸入目標
let controlMode = 'keys';     // tilt | keys | drag
let sens = 1.0;               // 靈敏度
let calBeta = null, calGamma = null;  // 陀螺儀校正基準
let lastBeta = 0, lastGamma = 0;
const keys = Object.create(null);

/* ══════════════ 音效（Web Audio 合成，不用音檔） ══════════════
   iOS 需要使用者手勢後才能啟動 AudioContext → 在按下按鈕時才 initAudio()。 */
let actx = null;
let sfxOn = true;
function initAudio() {
  if (actx) { if (actx.state === 'suspended' && actx.resume) actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, sweepTo) {
  if (!sfxOn || !actx || actx.state === 'suspended') return;
  try {
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  } catch (e) {}
}
function sfxWall(impact) {
  const now = (actx && actx.currentTime) || 0;
  if (now - lastWallSfx < 0.05) return;      // 節流：沿牆滑不要變成連續噪音
  lastWallSfx = now;
  const v = Math.min(0.22, 0.03 + impact * 0.022);
  tone(90 + impact * 8, 0.07, 'triangle', v);   // 木頭悶響
}
function sfxFall() { tone(400, 0.42, 'sine', 0.16, 70); }
// 踏上／離開地形時出聲。地形換了玩家要**立刻知道**，否則「轉不動」會被當成 bug 而非設計。
function sfxTerrain(ch) {
  if (ch === '~') tone(1180, 0.09, 'sine', 0.09, 1560);       // 冰：清脆上揚
  else if (ch === ':') tone(150, 0.13, 'sawtooth', 0.07, 90); // 沙：低沉悶響
  else tone(520, 0.06, 'sine', 0.05);                          // 回到一般地面
}
function sfxClear() {
  tone(523, 0.13, 'triangle', 0.14);
  setTimeout(() => tone(659, 0.13, 'triangle', 0.14), 110);
  setTimeout(() => tone(784, 0.30, 'triangle', 0.15), 220);
}

/* ══════════════ 進度儲存 ══════════════ */
function lsGet(k, d) {
  try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; }
}
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

let cleared = parseInt(lsGet('maze_cleared', '0'), 10) || 0;   // 已通關的最高關卡數
let perfects = parseInt(lsGet('maze_perfect', '0'), 10) || 0;  // 無失誤通關的關卡數
let times = (() => { try { return JSON.parse(lsGet('maze_times', '{}')) || {}; } catch (e) { return {}; } })();
// 三星：完成=1、失誤≤2=2、無失誤=3。不用碼表，所以評的是「穩」不是「快」。
let stars = (() => { try { return JSON.parse(lsGet('maze_stars', '{}')) || {}; } catch (e) { return {}; } })();
sens = parseFloat(lsGet('maze_sens', '1')) || 1;
sfxOn = lsGet('maze_sfx', '1') !== '0';

function starFor(f) { return f === 0 ? 3 : (f <= 2 ? 2 : 1); }
function totalStars() {
  let t = 0;
  for (const k in stars) t += stars[k] || 0;
  return t;
}
function saveProgress() {
  lsSet('maze_cleared', cleared);
  lsSet('maze_perfect', perfects);
  try { lsSet('maze_times', JSON.stringify(times)); } catch (e) {}
  try { lsSet('maze_stars', JSON.stringify(stars)); } catch (e) {}
}

// 重新開始：只清進度，**不動偏好設定**（靈敏度、音效是使用者調過的，跟進度無關）
let resetArmed = false;
function resetProgress() {
  cleared = 0; perfects = 0; times = {}; stars = {};
  try {
    localStorage.removeItem('maze_cleared');
    localStorage.removeItem('maze_perfect');
    localStorage.removeItem('maze_times');
    localStorage.removeItem('maze_stars');
  } catch (e) {}
}

/* 關卡改版偵測。
   localStorage 是每台裝置各自獨立的，舊裝置上的進度是針對「舊的那批關卡」記的。
   關卡結構整個換掉之後，那份進度不只沒意義，還會把玩家直接送到最難的一關，
   跳過整條重新設計的難度曲線 —— 所以由程式主動作廢，不要求玩家自己去清。
   ⚠ 動到 LEVELS 內容時，LEVELS_VERSION 要 +1。 */
const LEVELS_VERSION = 4;
const APP_VERSION = 'v9';     // 與 sw.js 的 CACHE 版本同步，顯示在主畫面底部供回報用
let progressWiped = false;
function migrateProgress() {
  const savedVer = parseInt(lsGet('maze_lv_ver', '0'), 10) || 0;
  if (savedVer < LEVELS_VERSION && (cleared > 0 || Object.keys(stars).length > 0)) {
    resetProgress();
    progressWiped = true;
  }
  lsSet('maze_lv_ver', LEVELS_VERSION);
}
migrateProgress();

/* ══════════════ 關卡解析 ══════════════ */
function parseLevel(rows) {
  const g = rows.slice();
  let s = null, gl = null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (g[r][c] === START) s = { c, r };
    if (g[r][c] === GOAL) gl = { c, r };
  }
  return { grid: g, start: s, goal: gl };
}
function cellCh(c, r) {
  if (r < 0 || r >= N || c < 0 || c >= N || !grid) return WALL;
  return grid[r][c];
}
function cellAt(x, y) { return cellCh(Math.floor(x), Math.floor(y)); }
function isWall(c, r) { return cellCh(c, r) === WALL; }

/* ══════════════ 可解性驗證（configuration space）══════════════
   把牆按珠半徑膨脹、把陷阱洞當禁區，在細網格上 flood fill。
   用的是上面真正的 BALL_R / HOLE_R —— 調整珠子大小時，測試會自動用新值重驗全部關卡。 */
function verifyLevel(rows, step) {
  step = step || 0.1;
  const M = Math.round(N / step);
  const free = new Uint8Array(M * M).fill(1);
  const idx = (i, j) => j * M + i;
  let s = null, gl = null;

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const ch = rows[r][c];
    if (ch === START) s = { c, r };
    if (ch === GOAL) gl = { c, r };
    if (ch === WALL) {
      const i0 = Math.max(0, Math.floor((c - BALL_R) / step)), i1 = Math.min(M - 1, Math.ceil((c + 1 + BALL_R) / step));
      const j0 = Math.max(0, Math.floor((r - BALL_R) / step)), j1 = Math.min(M - 1, Math.ceil((r + 1 + BALL_R) / step));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const x = (i + 0.5) * step, y = (j + 0.5) * step;
        const dx = Math.max(c - x, 0, x - (c + 1)), dy = Math.max(r - y, 0, y - (r + 1));
        if (dx * dx + dy * dy < BALL_R * BALL_R) free[idx(i, j)] = 0;
      }
    }
    if (ch === HOLE) {
      const hx = c + 0.5, hy = r + 0.5;
      const i0 = Math.max(0, Math.floor((hx - HOLE_R) / step)), i1 = Math.min(M - 1, Math.ceil((hx + HOLE_R) / step));
      const j0 = Math.max(0, Math.floor((hy - HOLE_R) / step)), j1 = Math.min(M - 1, Math.ceil((hy + HOLE_R) / step));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const dx = (i + 0.5) * step - hx, dy = (j + 0.5) * step - hy;
        if (dx * dx + dy * dy < HOLE_R * HOLE_R) free[idx(i, j)] = 0;
      }
    }
  }
  if (!s || !gl) return { ok: false, why: 'missing start or goal' };

  const toG = v => Math.min(M - 1, Math.max(0, Math.round(v / step - 0.5)));
  const si = toG(s.c + 0.5), sj = toG(s.r + 0.5);
  const gx = gl.c + 0.5, gy = gl.r + 0.5;
  if (!free[idx(si, sj)]) return { ok: false, why: 'start blocked' };

  const seen = new Uint8Array(M * M);
  const st = [[si, sj]];
  seen[idx(si, sj)] = 1;
  let reached = false, reach = 0;
  while (st.length) {
    const p = st.pop(), i = p[0], j = p[1];
    reach++;
    const dx = (i + 0.5) * step - gx, dy = (j + 0.5) * step - gy;
    if (dx * dx + dy * dy < HOLE_R * HOLE_R) reached = true;
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let k = 0; k < 4; k++) {
      const ni = i + nb[k][0], nj = j + nb[k][1];
      if (ni < 0 || nj < 0 || ni >= M || nj >= M) continue;
      if (seen[idx(ni, nj)] || !free[idx(ni, nj)]) continue;
      seen[idx(ni, nj)] = 1;
      st.push([ni, nj]);
    }
  }
  return { ok: reached, why: reached ? '' : 'goal unreachable', reach: reach };
}

/* ══════════════ 遊戲流程 ══════════════ */
function resetBall() {
  ball.x = startCell.c + 0.5;
  ball.y = startCell.r + 0.5;
  ball.vx = 0; ball.vy = 0;
  accumulator = 0;
}
function startGame(idx) {
  level = Math.max(0, Math.min(LEVELS.length - 1, idx | 0));
  const p = parseLevel(LEVELS[level]);
  grid = p.grid;
  startCell = p.start;
  goalCell = p.goal;
  elapsed = 0; fails = 0; anim = 0; fallAt = null;
  shake = 0; flash = 0;
  nameShow = 2.6;              // 開場顯示這關在考什麼（teach 的一部分）
  resetBall();
  state = 'playing';
  hideOverlay();
}
function loseBall(c, r) {
  fails++;
  fallAt = { x: c + 0.5, y: r + 0.5 };
  state = 'falling';
  anim = 0;
  shake = 0.4;
  sfxFall();
}
function winLevel() {
  fallAt = { x: goalCell.c + 0.5, y: goalCell.r + 0.5 };
  state = 'cleared';
  anim = 0;
  sfxClear();
  const key = String(level);
  if (times[key] === undefined || elapsed < times[key]) times[key] = Math.round(elapsed * 100) / 100;
  const s = starFor(fails);
  if (!stars[key] || s > stars[key]) stars[key] = s;
  if (level + 1 > cleared) cleared = level + 1;
  if (fails === 0 && level + 1 > perfects) perfects = level + 1;
  flash = 1;
  saveProgress();
}

/* ══════════════ 物理 ══════════════ */
function physStep(h) {
  const here = cellAt(ball.x, ball.y);

  // 踏上／離開地形的即時回饋
  const terr = (here === '~' || here === ':') ? here : '.';
  if (terr !== terrainNow) { terrainNow = terr; sfxTerrain(terr); }

  // 1. 重力（由傾斜量決定）。加速度拆成「沿速度」與「垂直速度」兩個分量分別打折：
  //    冰上轉向能力只剩 12%，但推力還有 45% → 球直直衝出去、明知要轉卻轉不動。
  const drv = DRIVE[here] === undefined ? 1.0 : DRIVE[here];
  const trn = TURN[here] === undefined ? 1.0 : TURN[here];
  const ax = tiltX * GRAVITY, ay = tiltY * GRAVITY;
  const sp0 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp0 > 0.25 && drv !== trn) {
    const ux = ball.vx / sp0, uy = ball.vy / sp0;
    const along = ax * ux + ay * uy;               // 平行分量（加速／煞車）
    const px = ax - along * ux, py = ay - along * uy;  // 垂直分量（轉彎）
    ball.vx += (along * ux * drv + px * trn) * h;
    ball.vy += (along * uy * drv + py * trn) * h;
  } else {
    // 球幾乎靜止時沒有「速度方向」可分解，退回單一倍率
    ball.vx += ax * drv * h;
    ball.vy += ay * drv * h;
  }

  // 2. 地形摩擦
  const fr = FRICTION[here];
  const damp = Math.exp(-(fr === undefined ? 0.55 : fr) * h);
  ball.vx *= damp; ball.vy *= damp;

  // 3. 速度上限 —— 這是防穿牆的核心，不是為了手感
  const sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp > MAX_SPEED) { ball.vx = ball.vx / sp * MAX_SPEED; ball.vy = ball.vy / sp * MAX_SPEED; }

  // 4. 位移（順便累積滾動相位，讓球看得出是在滾而不是在滑）
  const mx = ball.vx * h, my = ball.vy * h;
  ball.x += mx;
  ball.y += my;
  const moved = Math.sqrt(mx * mx + my * my);
  if (moved > 1e-9) {
    spin += moved / BALL_R;              // 滾過的弧長 / 半徑 = 轉過的角度
    spinX = mx / moved; spinY = my / moved;
  }

  // 5. 牆碰撞（圓 vs AABB，掃描珠子周圍格）
  const c0 = Math.floor(ball.x - BALL_R) - 1, c1 = Math.floor(ball.x + BALL_R) + 1;
  const r0 = Math.floor(ball.y - BALL_R) - 1, r1 = Math.floor(ball.y + BALL_R) + 1;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (!isWall(c, r)) continue;
      const nx = Math.max(c, Math.min(ball.x, c + 1));
      const ny = Math.max(r, Math.min(ball.y, r + 1));
      let dx = ball.x - nx, dy = ball.y - ny;
      let d2 = dx * dx + dy * dy;
      if (d2 >= BALL_R * BALL_R) continue;
      let ux, uy;
      if (d2 < 1e-12) {
        // 珠心落在牆格內（速度上限下不該發生）→ 朝離格中心最近的邊推出
        const ex = ball.x - (c + 0.5), ey = ball.y - (r + 0.5);
        if (Math.abs(ex) > Math.abs(ey)) { ux = ex >= 0 ? 1 : -1; uy = 0; }
        else { ux = 0; uy = ey >= 0 ? 1 : -1; }
        ball.x = c + 0.5 + ux * (0.5 + BALL_R);
        ball.y = r + 0.5 + uy * (0.5 + BALL_R);
      } else {
        const d = Math.sqrt(d2);
        ux = dx / d; uy = dy / d;
        ball.x = nx + ux * BALL_R;
        ball.y = ny + uy * BALL_R;
      }
      const vn = ball.vx * ux + ball.vy * uy;
      if (vn < 0) {
        if (vn < -1.2) sfxWall(-vn);     // 只有真的撞上去才出聲，擦過不算
        ball.vx -= (1 + RESTITUTION) * vn * ux;
        ball.vy -= (1 + RESTITUTION) * vn * uy;
      }
    }
  }

  // 6. 洞判定（珠心進入洞口半徑就掉）
  const bc = Math.floor(ball.x), br = Math.floor(ball.y);
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const c = bc + dc, r = br + dr;
      const ch = cellCh(c, r);
      if (ch !== HOLE && ch !== GOAL) continue;
      const dx = ball.x - (c + 0.5), dy = ball.y - (r + 0.5);
      if (dx * dx + dy * dy >= HOLE_R * HOLE_R) continue;
      if (ch === GOAL) winLevel(); else loseBall(c, r);
      return;
    }
  }
}

function update(dt) {
  if (dt > 0.1) dt = 0.1;   // 分頁切回來時的大跳躍，不要一次補完

  // 傾斜平滑（鍵盤/拖曳輸入需要，陀螺儀本身已連續）
  const k = Math.min(1, dt * TILT_SMOOTH);
  tiltX += (targetTiltX - tiltX) * k;
  tiltY += (targetTiltY - tiltY) * k;

  // juice 衰減
  if (shake > 0) shake = Math.max(0, shake - dt * 1.7);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.9);
  if (nameShow > 0) nameShow = Math.max(0, nameShow - dt);

  if (state === 'playing') {
    elapsed += dt;
    accumulator += dt;
    let n = 0;
    while (accumulator >= FIXED_DT && n < MAX_SUBSTEPS) {
      physStep(FIXED_DT);
      accumulator -= FIXED_DT;
      n++;
      if (state !== 'playing') { accumulator = 0; break; }
    }
    if (n >= MAX_SUBSTEPS) accumulator = 0;
  } else if (state === 'falling') {
    anim += dt;
    if (anim >= FALL_TIME) { resetBall(); state = 'playing'; anim = 0; fallAt = null; }
  } else if (state === 'cleared') {
    anim += dt;
    if (anim >= CLEAR_TIME) {
      if (level + 1 >= LEVELS.length) { state = 'finished'; showFinished(); }
      else { showCleared(); }
    }
  }
}

/* ══════════════ 輸入 ══════════════ */
function setTilt(ax, ay) {
  targetTiltX = Math.max(-1, Math.min(1, ax));
  targetTiltY = Math.max(-1, Math.min(1, ay));
}

// 依螢幕方向把 beta/gamma 換算成螢幕座標的傾斜
function orientationToTilt(beta, gamma, angle) {
  let ax, ay;
  if (angle === 90) { ax = beta; ay = -gamma; }
  else if (angle === 180) { ax = -gamma; ay = -beta; }
  else if (angle === 270 || angle === -90) { ax = -beta; ay = gamma; }
  else { ax = gamma; ay = beta; }
  return [ax, ay];
}
function screenAngle() {
  try {
    if (typeof screen !== 'undefined' && screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof orientation === 'number') return orientation;
  } catch (e) {}
  return 0;
}
function onOrientation(e) {
  if (e.beta === null || e.gamma === null) return;
  lastBeta = e.beta; lastGamma = e.gamma;
  if (calBeta === null) { calBeta = e.beta; calGamma = e.gamma; }
  const t = orientationToTilt(e.beta - calBeta, e.gamma - calGamma, screenAngle());
  const nx = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, t[0] * sens)) / MAX_TILT_DEG;
  const ny = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, t[1] * sens)) / MAX_TILT_DEG;
  controlMode = 'tilt';
  setTilt(nx, ny);
}
function recalibrate() { calBeta = lastBeta; calGamma = lastGamma; setTilt(0, 0); tiltX = 0; tiltY = 0; }

function keyTilt() {
  if (controlMode === 'tilt') return;
  const l = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const r = keys['ArrowRight'] || keys['d'] || keys['D'];
  const u = keys['ArrowUp'] || keys['w'] || keys['W'];
  const dn = keys['ArrowDown'] || keys['s'] || keys['S'];
  setTilt((r ? 1 : 0) - (l ? 1 : 0), (dn ? 1 : 0) - (u ? 1 : 0));
}

/* ══════════════ 畫面 ══════════════ */
const cv = document.getElementById('cv');
const ctx = cv ? cv.getContext('2d') : null;
let W = 800, H = 600, board = 400, ox = 0, oy = 0, cellPx = 26;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 800;
  H = window.innerHeight || 600;
  if (cv) {
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    if (ctx && ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const hud = 52, bottom = 46, pad = 10;
  board = Math.max(120, Math.min(W - pad * 2, H - hud - bottom - pad * 2));
  ox = (W - board) / 2;
  // 重心偏上：手機直式時剩餘空間 1/3 給上方、2/3 留給下方持機的手，免得拇指擋住盤面
  oy = hud + Math.max(pad, (H - hud - bottom - board) * 0.34);
  cellPx = board / N;
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return m > 0 ? m + ':' + (s < 10 ? '0' : '') + s.toFixed(1) : s.toFixed(1) + 's';
}

function draw() {
  if (!ctx) return;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  if (!grid) return;

  // 盤面隨傾斜輕微位移，讓「盤子在傾斜」這件事看得見；掉洞時疊加震動
  let shx = tiltX * 5, shy = tiltY * 5;
  if (shake > 0) {
    const amp = shake * 13;
    shx += (Math.random() * 2 - 1) * amp;
    shy += (Math.random() * 2 - 1) * amp;
  }

  ctx.save();
  ctx.translate(ox + shx, oy + shy);

  // 盤底：單一實色。夠亮讓路徑清楚、夠沉不刺眼，暖灰不是慘白。
  ctx.fillStyle = C.board;
  ctx.fillRect(0, 0, board, board);

  /* 逐格填色時必須對齊像素邊界再畫。
     cellPx 通常不是整數（例如 410/19 ≈ 21.58），直接 fillRect 會在每格邊緣留下
     半透明的抗鋸齒縫 → 整片牆看起來爬滿格線，像試算表。這是廉價感的來源之一。 */
  const cellRect = (c, r) => {
    const x0 = Math.floor(c * cellPx), y0 = Math.floor(r * cellPx);
    ctx.fillRect(x0, y0, Math.ceil((c + 1) * cellPx) - x0, Math.ceil((r + 1) * cellPx) - y0);
  };

  // 地形
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const ch = grid[r][c];
      if (ch !== ICE && ch !== SAND) continue;
      // 對比刻意拉高：地形換了玩家要一眼看見，否則「剎不住」會被當成 bug 而不是設計
      // 地形：實色色塊，靠顏色區分，不做反光也不做顆粒
      ctx.fillStyle = ch === ICE ? C.ice : C.sand;
      cellRect(c, r);
    }
  }

  // 牆（陰影方向跟著傾斜，強化立體感）
  /* 牆：單一實色，就這樣。
     ⚠ 不要偽 3D 側壁、不要頂部高光、不要格線、不要漸層。
       v7 加每格亮邊 → 看起來像廉價磚牆；v8 加 forced perspective 側壁 → 更廉價。
       兩次都是同一個毛病：**用擬真效果冒充質感**。這個遊戲的定位是簡單平面，
       克制才是功力（Gary 對其他作品也是這個偏好）。 */
  ctx.fillStyle = C.wall;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] !== WALL) continue;
    cellRect(c, r);
  }

  // 洞
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const ch = grid[r][c];
      if (ch !== HOLE && ch !== GOAL) continue;
      const x = (c + 0.5) * cellPx, y = (r + 0.5) * cellPx, rad = HOLE_R * cellPx;
      if (ch === GOAL) {
        // 終點：同樣是實心圓，靠一圈亮色環跟陷阱區分
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fillStyle = C.hole; ctx.fill();
        ctx.lineWidth = Math.max(2, cellPx * 0.13);
        ctx.strokeStyle = C.goal; ctx.stroke();
      } else {
        // 洞：實心圓，不做漸層深度。形狀和顏色已經足以表達「這裡不能碰」。
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fillStyle = C.hole; ctx.fill();
      }
    }
  }

  // 珠子
  let bx = ball.x * cellPx, by = ball.y * cellPx, br = BALL_R * cellPx;
  let alpha = 1;
  if (state === 'falling' && fallAt) {
    const t = Math.min(1, anim / FALL_TIME);
    bx = fallAt.x * cellPx; by = fallAt.y * cellPx;
    br = BALL_R * cellPx * (1 - t * 0.85);
    alpha = 1 - t * 0.7;
  } else if (state === 'cleared' && fallAt) {
    const t = Math.min(1, anim / CLEAR_TIME);
    bx = fallAt.x * cellPx; by = fallAt.y * cellPx;
    br = BALL_R * cellPx * (1 - t * 0.8);
    alpha = 1 - t * 0.5;
  }
  if (br > 0.4) {
    ctx.globalAlpha = alpha;
    // 球踩在冰上時罩一層藍光 —— 「現在轉不動」要是看得見的狀態，不是只能用猜的
    // 球：實色圓 + 一個固定的小高光點。不做徑向漸層、不做投影、不做冰上光暈。
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fillStyle = C.ball; ctx.fill();
    ctx.beginPath();
    ctx.arc(bx - br * 0.30, by - br * 0.30, br * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = C.ballHi; ctx.fill();

    ctx.globalAlpha = 1;
  }

  // 盤框
  ctx.lineWidth = 3; ctx.strokeStyle = C.wall;
  ctx.strokeRect(0, 0, board, board);
  ctx.restore();

  // HUD
  ctx.fillStyle = '#e6edf3';
  ctx.font = '600 17px -apple-system,system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('第 ' + (level + 1) + ' 關', 16, 26);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e6c15a';
  ctx.fillText(fmtTime(elapsed), W / 2, 26);
  // 星等即時顯示：玩家隨時知道自己還剩幾星可拿 → 掉一次就有重來的動機
  const cs = starFor(fails);
  ctx.textAlign = 'right';
  ctx.fillStyle = cs === 3 ? '#e6c15a' : (cs === 2 ? '#b7c2d0' : '#e07a5a');
  ctx.fillText('★'.repeat(cs) + '☆'.repeat(3 - cs) + (fails ? '  ' + fails : ''), W - 16, 26);

  // 底部提示
  ctx.textAlign = 'center';
  ctx.font = '12px -apple-system,system-ui,sans-serif';
  ctx.fillStyle = '#4c5766';
  const best = times[String(level)];
  const modeTxt = controlMode === 'tilt' ? '傾斜手機' : (controlMode === 'drag' ? '拖曳畫面' : '方向鍵 / WASD');
  ctx.fillText(modeTxt + (best !== undefined ? '　·　本關最佳 ' + fmtTime(best) : '') + '　·　P 暫停', W / 2, H - 24);

  // 開場的關卡主題提示：讓玩家知道這一關在考什麼（teach）
  if (nameShow > 0 && LEVEL_NAMES[level]) {
    const a = Math.min(1, nameShow / 0.6);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e6c15a';
    ctx.font = '600 19px -apple-system,system-ui,sans-serif';
    ctx.fillText(LEVEL_NAMES[level], W / 2, oy - 18);
    ctx.globalAlpha = 1;
  }

  // 過關閃光
  if (flash > 0) {
    ctx.fillStyle = 'rgba(230,193,90,' + (flash * 0.20).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ══════════════ 疊層 UI ══════════════ */
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

function showOverlay(html) {
  if (!panel || !overlay) return;
  panel.innerHTML = html;
  overlay.classList.remove('hidden');
}
function hideOverlay() { if (overlay) overlay.classList.add('hidden'); }

function levelGrid() {
  let h = '<div class="grid">';
  for (let i = 0; i < LEVELS.length; i++) {
    const lock = i > cleared;
    const st = stars[String(i)] || 0;
    const cls = lock ? 'lv lock' : (st === 3 ? 'lv perfect' : (st > 0 ? 'lv done' : 'lv'));
    h += '<button class="' + cls + '"' + (lock ? ' disabled' : ' data-act="play" data-lv="' + i + '"') + '>' +
      (i + 1) + '<span class="st">' + (st ? '★'.repeat(st) : '') + '</span></button>';
  }
  return h + '</div>';
}

function showTitle() {
  state = 'menu';
  const started = cleared > 0;
  const wiped = progressWiped;
  progressWiped = false;              // 只提示一次，之後回主畫面不再重複
  showOverlay(
    '<h1>迷宮球</h1><div class="sub">TILT MAZE</div>' +
    (wiped ? '<div class="msg" style="color:#e6c15a;border:1px solid #4a3f1c;border-radius:10px;padding:12px">20 關已全面改版：盤面、路線、陷阱、手感全部重做。\n舊進度不適用，已從第 1 關重新開始。</div>' : '') +
    '<div class="msg">傾斜手機，把金珠滾進<span style="color:#e6c15a">金色終點洞</span>。\n黑洞會吃掉珠子，冰面很滑、沙地很黏。</div>' +
    (started ? '<div class="msg" style="color:#e6c15a;margin-top:-10px">★ ' + totalStars() + ' / ' + (LEVELS.length * 3) + '</div>' : '') +
    '<button class="primary" data-act="start">' + (started ? '繼續第 ' + Math.min(cleared + 1, LEVELS.length) + ' 關' : '開始遊戲') + '</button>' +
    (started ? '<button data-act="levels">選擇關卡</button>' : '') +
    '<button class="ghost" data-act="settings">設定</button>' +
    '<div class="note">iPhone / Android 會請求動作感測器權限；電腦上用方向鍵或滑鼠拖曳。<br>' +
    '<span style="color:#4c5766">' + APP_VERSION + ' · 關卡 v' + LEVELS_VERSION + '</span></div>',
  );
}
function showLevels() {
  showOverlay('<h1>選擇關卡</h1><div class="sub">★ ' + totalStars() + ' / ' + (LEVELS.length * 3) + '</div>' +
    levelGrid() +
    '<div class="note" style="margin-bottom:14px">★★★ = 無失誤　★★ = 失誤 2 次內　★ = 完成</div>' +
    '<button class="ghost" data-act="title">返回</button>');
}
function showSettings() {
  showOverlay('<h1>設定</h1><div class="sub">SETTINGS</div>' +
    '<div class="row"><span>靈敏度</span><input type="range" id="sens" min="0.4" max="2.2" step="0.1" value="' + sens + '"><span id="sensv">' + sens.toFixed(1) + '</span></div>' +
    '<button data-act="recal">把目前姿勢設為水平</button>' +
    '<button data-act="sfx">音效：' + (sfxOn ? '開' : '關') + '</button>' +
    '<button data-act="update">檢查更新（' + APP_VERSION + '）</button>' +
    '<div class="note" style="margin-bottom:14px">拿著手機的角度不會是完全水平。覺得球一直往同一邊跑，就按上面那顆重新校正。</div>' +
    (cleared > 0
      ? '<button data-act="reset" class="' + (resetArmed ? 'danger' : 'ghost') + '">' +
        (resetArmed ? '⚠ 再按一次，' + cleared + ' 關進度與 ★' + totalStars() + ' 會全部清掉' : '重新開始（清除進度）') + '</button>' +
        (resetArmed ? '<button class="ghost" data-act="settings">取消</button>' : '')
      : '<div class="note" style="margin-bottom:14px">目前沒有進度可清除。</div>') +
    '<button class="ghost" data-act="title">返回</button>');
  const el = document.getElementById('sens');
  if (el && el.addEventListener) el.addEventListener('input', function () {
    sens = parseFloat(el.value) || 1;
    lsSet('maze_sens', sens);
    const v = document.getElementById('sensv');
    if (v) v.textContent = sens.toFixed(1);
  });
}
function showCleared() {
  state = 'menu';
  const best = times[String(level)];
  const got = starFor(fails);
  const hint = got === 3 ? '三星達成' : (got === 2 ? '無失誤通關可拿第三顆星' : '失誤 2 次以內可拿兩星');
  showOverlay('<div class="big">' + '★'.repeat(got) + '<span style="color:#3a4252">' + '★'.repeat(3 - got) + '</span></div>' +
    '<div class="sub">第 ' + (level + 1) + ' 關 · ' + (LEVEL_NAMES[level] || '') + '</div>' +
    '<div class="msg">' + (fails === 0 ? '無失誤' : '失誤 ' + fails + ' 次') + '　用時 ' + fmtTime(elapsed) +
    (best !== undefined && best < elapsed ? '\n最佳 ' + fmtTime(best) : '') + '\n' + hint + '</div>' +
    '<button class="primary" data-act="next">下一關</button>' +
    '<button data-act="retry">重玩本關</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}
function showFinished() {
  state = 'menu';
  showOverlay('<div class="big">全部 ' + LEVELS.length + ' 關通關</div><div class="sub">TILT MAZE CLEARED</div>' +
    '<div class="msg">★ ' + totalStars() + ' / ' + (LEVELS.length * 3) +
    (totalStars() < LEVELS.length * 3 ? '\n還有星星沒拿到 —— 無失誤才是三星。' : '\n全三星。這盤你已經摸透了。') + '</div>' +
    '<button class="primary" data-act="levels">回頭補星</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}
function showPaused() {
  showOverlay('<h1>暫停</h1><div class="sub">第 ' + (level + 1) + ' 關</div>' +
    '<button class="primary" data-act="resume">繼續</button>' +
    '<button data-act="retry">重玩本關</button>' +
    '<button data-act="recal">重新校正水平</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}

/* ══════════════ 感測器權限 ══════════════ */
function enableTilt() {
  // iOS 13+ 必須在使用者手勢裡呼叫；拒絕或不支援就退回拖曳操作
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      return DOE.requestPermission().then(function (res) {
        if (res === 'granted') { window.addEventListener('deviceorientation', onOrientation); controlMode = 'tilt'; }
        else controlMode = 'drag';
      }).catch(function () { controlMode = 'drag'; });
    }
    if (DOE) { window.addEventListener('deviceorientation', onOrientation); }
  } catch (e) {}
  return Promise.resolve();
}

/* ══════════════ 強制更新 ══════════════
   最後手段：砍掉所有快取、註銷 sw，再用帶時戳的網址重載。
   給「重開好幾次還是舊版」的情況用 —— 玩家不該需要去系統設定清網站資料。 */
function forceUpdate() {
  const done = function () {
    const u = location.origin + location.pathname + '?u=' + Date.now();
    location.replace(u);
  };
  try {
    const jobs = [];
    if (typeof caches !== 'undefined' && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (!jobs.length) return done();
    Promise.all(jobs).then(done, done);
    setTimeout(done, 2500);        // 卡住也要走
  } catch (e) { done(); }
}

/* ══════════════ 事件 ══════════════ */
function act(a, el) {
  initAudio();                          // 必須在使用者手勢裡啟動，iOS 才給聲音
  // 離開「重新開始」按鈕就解除待確認狀態，避免下次進設定還停在危險狀態
  if (a !== 'reset') resetArmed = false;
  if (a === 'start') { enableTilt(); startGame(Math.min(cleared, LEVELS.length - 1)); }
  else if (a === 'play') { enableTilt(); startGame(parseInt(el.getAttribute('data-lv'), 10) || 0); }
  else if (a === 'levels') showLevels();
  else if (a === 'settings') showSettings();
  else if (a === 'title') showTitle();
  else if (a === 'next') startGame(Math.min(level + 1, LEVELS.length - 1));
  else if (a === 'retry') startGame(level);
  else if (a === 'resume') { state = 'playing'; hideOverlay(); }
  else if (a === 'recal') { recalibrate(); }
  else if (a === 'sfx') { sfxOn = !sfxOn; lsSet('maze_sfx', sfxOn ? '1' : '0'); if (sfxOn) tone(660, 0.1, 'triangle', 0.12); showSettings(); }
  else if (a === 'reset') {
    if (!resetArmed) { resetArmed = true; showSettings(); }        // 第一次只是舉起，不動資料
    else { resetProgress(); resetArmed = false; showTitle(); }     // 再按一次才真的清
  }
  else if (a === 'update') forceUpdate();
}

function bindEvents() {
  if (overlay && overlay.addEventListener) {
    overlay.addEventListener('click', function (e) {
      let t = e.target;
      while (t && t !== overlay && !t.getAttribute?.('data-act')) t = t.parentNode;
      const a = t && t.getAttribute ? t.getAttribute('data-act') : null;
      if (a) act(a, t);
    });
  }
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'playing') { state = 'paused'; showPaused(); }
      else if (state === 'paused') { state = 'playing'; hideOverlay(); }
    }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0 && e.preventDefault) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  // 拖曳操作（電腦滑鼠 / 沒有感測器權限的手機）
  let dragging = false;
  function pt(e) {
    const t = (e.touches && e.touches[0]) || e;
    return { x: t.clientX, y: t.clientY };
  }
  function dragTo(e) {
    if (!dragging || controlMode === 'tilt') return;
    const p = pt(e);
    const cx = ox + board / 2, cy = oy + board / 2;
    const rad = board / 2;
    controlMode = 'drag';
    setTilt(((p.x - cx) / rad) * sens, ((p.y - cy) / rad) * sens);
  }
  function down(e) { dragging = true; dragTo(e); }
  function up() { dragging = false; if (controlMode === 'drag') setTilt(0, 0); }
  if (cv && cv.addEventListener) {
    cv.addEventListener('mousedown', down);
    cv.addEventListener('mousemove', dragTo);
    cv.addEventListener('touchstart', function (e) { down(e); if (e.preventDefault) e.preventDefault(); }, { passive: false });
    cv.addEventListener('touchmove', function (e) { dragTo(e); if (e.preventDefault) e.preventDefault(); }, { passive: false });
    cv.addEventListener('touchend', up);
  }
  window.addEventListener('mouseup', up);
  window.addEventListener('blur', function () { dragging = false; if (state === 'playing') { state = 'paused'; showPaused(); } });
}

/* ══════════════ 主迴圈 ══════════════ */
let lastT = 0;
function frame(t) {
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
  lastT = t;
  keyTilt();
  if (state !== 'paused' && state !== 'menu') update(dt);
  draw();
  requestAnimationFrame(frame);
}

function init() {
  resize();
  bindEvents();
  grid = parseLevel(LEVELS[0]).grid;   // 讓標題畫面背後有東西可看
  showTitle();
  requestAnimationFrame(frame);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // updateViaCache:'none' —— 不讓瀏覽器快取 sw.js 本身，否則新版 sw 永遠裝不上，
    // 玩家會一直被舊 sw 服務舊 HTML（v5 就是這樣卡住的）。
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) {}
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          // 新版裝好且目前已有 controller（代表是「更新」不是首次安裝）→ 自動換上新版
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            location.reload();
          }
        });
      });
    }).catch(function () {});
  }
}
init();
</script>
