<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>迷宮球 TILT MAZE</title>
<style>
  /* ── 一組配色，全畫面共用 ──
     v9 以前選單是 GitHub 那種冷藍灰（#0b0e14），盤面卻是暖木色 —— 兩套互不相干的色系
     擺在同一個 app 裡，每次從選單切進遊戲都像換了一個產品。現在全部統一在暖色軸上，
     選單的底色就是盤面周圍的底色。 */
  :root {
    --bg:#15120d; --surface:#221d16; --surface-2:#2b241b; --line:#3b3327;
    --text:#f2ece0; --dim:#a1937c; --faint:#6d624f;
    --gold:#e8b93a; --gold-ink:#1d1606; --danger:#d9705c;
    --r:14px;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
    -webkit-font-smoothing:antialiased; }
  #cv { display:block; width:100%; height:100%; touch-action:none; }

  /* 安全區探針：CSS 有 env()，JS 沒有。用兩個看不見的元素把 env() 換算成可量的高度，
     resize() 讀它們來決定 HUD 與盤面的位置（見 readSafeInsets）。 */
  #sa-t,#sa-b { position:fixed; left:0; width:0; visibility:hidden; pointer-events:none; }
  #sa-t { top:0; height:var(--sat); }
  #sa-b { bottom:0; height:var(--sab); }

  /* ── 遊戲中的固定按鍵 ──
     ⚠ v9 以前手機上完全沒有辦法暫停（只綁了鍵盤 P）。這是真正的功能缺口，不是美化。
     44×44 是可靠的最小點擊區。 */
  #hudbar { position:fixed; top:0; left:0; right:0; z-index:5; pointer-events:none;
    padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px); }
  #hudbar.hidden { display:none; }
  #pause { pointer-events:auto; width:44px; height:44px; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer;
    border-radius:12px; transition:background .12s; }
  #pause:active { background:rgba(255,255,255,.07); }
  #pause i { display:block; width:4px; height:16px; border-radius:2px; background:var(--dim); }

  /* ── 疊層 ──
     轉場只有兩個動作：底色淡入、面板往上浮 2%。畫面切換有沒有做動畫，
     是「一個 app」跟「一疊網頁」最便宜也最明顯的差別。 */
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(21,18,13,.90); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);
    overflow-y:auto; z-index:10; opacity:1; transition:opacity .16s ease; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #panel { width:100%; max-width:400px; text-align:center;
    animation:rise .26s cubic-bezier(.16,.84,.32,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) {
    #panel { animation:none; } #overlay { transition:none; }
  }

  /* ── 字級：四階，不要更多 ── */
  h1 { font-size:32px; font-weight:700; letter-spacing:.04em; line-height:1.15; }
  .sub { font-size:11px; letter-spacing:.36em; color:var(--dim); margin:8px 0 0;
    text-transform:uppercase; }
  .msg { font-size:14px; line-height:1.75; color:var(--dim); white-space:pre-line; }
  .big { font-size:30px; color:var(--gold); font-weight:700; letter-spacing:.12em; }
  .sp { height:22px; }
  .sp-s { height:14px; }

  /* 進度條：一眼看到「我走到哪、還剩多少」，比一行 ★12/90 直觀 */
  .prog { height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; margin:14px 0 4px; }
  .prog i { display:block; height:100%; background:var(--gold); border-radius:2px;
    transition:width .4s cubic-bezier(.16,.84,.32,1); }
  .progtx { display:flex; justify-content:space-between; font-size:11px; color:var(--faint);
    letter-spacing:.08em; }

  /* ── 按鈕 ── */
  button { font:inherit; font-size:16px; font-weight:500; padding:0 20px; height:52px; width:100%;
    margin-bottom:10px; background:var(--surface); color:var(--text);
    border:1px solid var(--line); border-radius:var(--r); cursor:pointer;
    transition:transform .09s ease, background .12s ease; }
  button:active { transform:scale(.975); background:var(--surface-2); }
  button.primary { background:var(--gold); color:var(--gold-ink); border-color:var(--gold); font-weight:600; }
  button.primary:active { background:#d5a92e; }
  button.ghost { background:transparent; color:var(--dim); border-color:transparent; height:46px; font-size:15px; }
  button.ghost:active { background:var(--surface); }
  button.danger { background:#3a201a; color:#ffb0a0; border-color:#7a4034; font-weight:600; }

  /* ── 選關：依章節分組 ──
     20 顆一模一樣的方塊看不出結構。遊戲本來就是「一章教一個機制」設計的，
     選關畫面沒有把這件事說出來，玩家就說不出第 12 關跟第 14 關差在哪。 */
  .chap { text-align:left; margin-bottom:20px; }
  .chap-h { display:flex; align-items:baseline; gap:8px; margin-bottom:9px; padding:0 2px; }
  .chap-n { font-size:11px; letter-spacing:.2em; color:var(--faint); }
  .chap-t { font-size:15px; font-weight:600; color:var(--text); }
  .chap-s { margin-left:auto; font-size:11px; color:var(--gold); letter-spacing:.06em; }
  .chap.lock .chap-t { color:var(--faint); }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .lv { padding:9px 0 7px; height:auto; margin:0; font-size:16px; font-weight:600;
    border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-variant-numeric:tabular-nums; }
  .lv.lock { color:#4a4234; border-color:#2a2419; background:#1c180f; cursor:default; }
  .lv.done { border-color:#4d5f3d; }
  .lv.perfect { border-color:var(--gold); color:var(--gold); }
  .lv .st { display:block; font-size:9px; letter-spacing:1.5px; line-height:1.5;
    color:var(--gold); min-height:14px; }
  .lv.lock .st { color:#4a4234; }

  /* ── 設定 ── */
  .row { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--dim);
    margin-bottom:16px; padding:0 2px; }
  .row b { font-weight:500; color:var(--text); font-variant-numeric:tabular-nums;
    min-width:30px; text-align:right; }
  input[type=range] { flex:1; accent-color:var(--gold); height:28px; }
  .note { font-size:12px; color:var(--faint); line-height:1.7; margin:4px 0 16px; }

  /* 圖例：新機制要先讓玩家知道那個顏色代表什麼，不然紫色方塊只是個奇怪的東西 */
  .legend { display:flex; flex-direction:column; gap:9px; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; margin-bottom:16px; }
  .lg { display:flex; align-items:center; gap:11px; font-size:13px; color:var(--dim); }
  /* 洞的顏色幾乎是黑的，直接放在深色卡片上會看不見 —— 給每個色塊一圈極淡的內描邊 */
  .lg s { width:18px; height:18px; border-radius:5px; flex:none; text-decoration:none;
    box-shadow:inset 0 0 0 1px rgba(242,236,224,.14); }
</style>
</head>

/* ══════════════ 音效（Web Audio 合成，不用音檔） ══════════════
   iOS 需要使用者手勢後才能啟動 AudioContext → 在按下按鈕時才 initAudio()。 */
let actx = null;
let sfxOn = true;
function initAudio() {
  if (actx) { if (actx.state === 'suspended' && actx.resume) actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, sweepTo) {
  if (!sfxOn || !actx || actx.state === 'suspended') return;
  try {
    const t = actx.currentTime;
    const osc = actx.createOscillator();
    const g = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(actx.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
  } catch (e) {}
}
function sfxWall(impact) {
  const now = (actx && actx.currentTime) || 0;
  if (now - lastWallSfx < 0.05) return;      // 節流：沿牆滑不要變成連續噪音
  lastWallSfx = now;
  const v = Math.min(0.22, 0.03 + impact * 0.022);
  tone(90 + impact * 8, 0.07, 'triangle', v);   // 木頭悶響
}
function sfxFall() { tone(400, 0.42, 'sine', 0.16, 70); }
// 踏上／離開地形時出聲。地形換了玩家要**立刻知道**，否則「轉不動」會被當成 bug 而非設計。
function sfxTerrain(ch) {
  if (ch === '~') tone(1180, 0.09, 'sine', 0.09, 1560);       // 冰：清脆上揚
  else if (ch === ':') tone(150, 0.13, 'sawtooth', 0.07, 90); // 沙：低沉悶響
  else if (ch === '>') tone(300, 0.16, 'sawtooth', 0.06, 240); // 逆流：低頻下滑，像被往回拉
  else tone(520, 0.06, 'sine', 0.05);                          // 回到一般地面
}
// 踩到開關：門通常在畫面另一頭，沒有聲音＋畫面提示，玩家不會知道剛剛發生了什麼事
function sfxSwitch() {
  tone(700, 0.10, 'triangle', 0.13);
  setTimeout(() => tone(1050, 0.16, 'triangle', 0.12), 90);
}
function sfxClear() {
  tone(523, 0.13, 'triangle', 0.14);
  setTimeout(() => tone(659, 0.13, 'triangle', 0.14), 110);
  setTimeout(() => tone(784, 0.30, 'triangle', 0.15), 220);
}

/* ══════════════ 進度儲存 ══════════════ */
function lsGet(k, d) {
  try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; }
}
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

let cleared = parseInt(lsGet('maze_cleared', '0'), 10) || 0;   // 已通關的最高關卡數
let perfects = parseInt(lsGet('maze_perfect', '0'), 10) || 0;  // 無失誤通關的關卡數
let times = (() => { try { return JSON.parse(lsGet('maze_times', '{}')) || {}; } catch (e) { return {}; } })();
// 三星：完成=1、失誤≤2=2、無失誤=3。不用碼表，所以評的是「穩」不是「快」。
let stars = (() => { try { return JSON.parse(lsGet('maze_stars', '{}')) || {}; } catch (e) { return {}; } })();
sens = parseFloat(lsGet('maze_sens', '1')) || 1;
sfxOn = lsGet('maze_sfx', '1') !== '0';

function starFor(f) { return f === 0 ? 3 : (f <= 2 ? 2 : 1); }
function totalStars() {
  let t = 0;
  for (const k in stars) t += stars[k] || 0;
  return t;
}
function saveProgress() {
  lsSet('maze_cleared', cleared);
  lsSet('maze_perfect', perfects);
  try { lsSet('maze_times', JSON.stringify(times)); } catch (e) {}
  try { lsSet('maze_stars', JSON.stringify(stars)); } catch (e) {}
}

// 重新開始：只清進度，**不動偏好設定**（靈敏度、音效是使用者調過的，跟進度無關）
let resetArmed = false;
function resetProgress() {
  cleared = 0; perfects = 0; times = {}; stars = {};
  try {
    localStorage.removeItem('maze_cleared');
    localStorage.removeItem('maze_perfect');
    localStorage.removeItem('maze_times');
    localStorage.removeItem('maze_stars');
  } catch (e) {}
}

/* 關卡改版偵測。
   localStorage 是每台裝置各自獨立的，舊裝置上的進度是針對「舊的那批關卡」記的。
   關卡結構整個換掉之後，那份進度不只沒意義，還會把玩家直接送到最難的一關，
   跳過整條重新設計的難度曲線 —— 所以由程式主動作廢，不要求玩家自己去清。
   ⚠ 動到 LEVELS 內容時，LEVELS_VERSION 要 +1。 */
const LEVELS_VERSION = 5;
const APP_VERSION = 'v10';     // 與 sw.js 的 CACHE 版本同步，顯示在主畫面底部供回報用
let progressWiped = false;
function migrateProgress() {
  const savedVer = parseInt(lsGet('maze_lv_ver', '0'), 10) || 0;
  if (savedVer < LEVELS_VERSION && (cleared > 0 || Object.keys(stars).length > 0)) {
    resetProgress();
    progressWiped = true;
  }
  lsSet('maze_lv_ver', LEVELS_VERSION);
}
migrateProgress();

/* ══════════════ 關卡解析 ══════════════ */
function parseLevel(rows) {
  const g = rows.slice();
  let s = null, gl = null, sw = null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (g[r][c] === START) s = { c, r };
    if (g[r][c] === GOAL) gl = { c, r };
    if (g[r][c] === SWITCH) sw = { c, r };
  }
  return { grid: g, start: s, goal: gl, sw: sw };
}
function cellCh(c, r) {
  if (r < 0 || r >= N || c < 0 || c >= N || !grid) return WALL;
  return grid[r][c];
}
function cellAt(x, y) { return cellCh(Math.floor(x), Math.floor(y)); }
// 門在關著的時候就是牆。isWall 是碰撞的唯一入口，所以門只要在這裡處理，物理其他部分不必知道門的存在。
function isWall(c, r) {
  const ch = cellCh(c, r);
  return ch === WALL || (ch === GATE && !gateOpen);
}

/* ══════════════ 可解性驗證（configuration space）══════════════
   把牆按珠半徑膨脹、把陷阱洞當禁區，在細網格上 flood fill。
   用的是上面真正的 BALL_R / HOLE_R —— 調整珠子大小時，測試會自動用新值重驗全部關卡。

   opt.gateOpen  門是否當成通路（預設 false＝當牆）
   opt.from/to   覆寫起點／終點，用來做開關關卡的兩階段驗證
   opt.toR       抵達判定半徑（終點洞用 HOLE_R，開關用 SWITCH_R）
   opt.fromR     起點是一個「圓」而不是一個點時的半徑（見下方多源播種）
   ⚠ 逆流不進這裡：它只改加速度不改可通行性。真正守住「流不會強到頂不回去」的，
     是 smoke test 的 FLOW_ACCEL / GRAVITY 不等式，不是 flood fill。 */
function verifyLevel(rows, step, opt) {
  step = step || 0.1;
  opt = opt || {};
  const M = Math.round(N / step);
  const free = new Uint8Array(M * M).fill(1);
  const idx = (i, j) => j * M + i;
  let s = null, gl = null;

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const ch = rows[r][c];
    if (ch === START) s = { c, r };
    if (ch === GOAL) gl = { c, r };
    if (ch === WALL || (ch === GATE && !opt.gateOpen)) {
      const i0 = Math.max(0, Math.floor((c - BALL_R) / step)), i1 = Math.min(M - 1, Math.ceil((c + 1 + BALL_R) / step));
      const j0 = Math.max(0, Math.floor((r - BALL_R) / step)), j1 = Math.min(M - 1, Math.ceil((r + 1 + BALL_R) / step));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const x = (i + 0.5) * step, y = (j + 0.5) * step;
        const dx = Math.max(c - x, 0, x - (c + 1)), dy = Math.max(r - y, 0, y - (r + 1));
        if (dx * dx + dy * dy < BALL_R * BALL_R) free[idx(i, j)] = 0;
      }
    }
    if (ch === HOLE) {
      const hx = c + 0.5, hy = r + 0.5;
      const i0 = Math.max(0, Math.floor((hx - HOLE_R) / step)), i1 = Math.min(M - 1, Math.ceil((hx + HOLE_R) / step));
      const j0 = Math.max(0, Math.floor((hy - HOLE_R) / step)), j1 = Math.min(M - 1, Math.ceil((hy + HOLE_R) / step));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const dx = (i + 0.5) * step - hx, dy = (j + 0.5) * step - hy;
        if (dx * dx + dy * dy < HOLE_R * HOLE_R) free[idx(i, j)] = 0;
      }
    }
  }
  const from = opt.from || s, to = opt.to || gl;
  const toR = opt.toR === undefined ? HOLE_R : opt.toR;
  if (!from || !to) return { ok: false, why: 'missing start or goal' };

  const toG = v => Math.min(M - 1, Math.max(0, Math.round(v / step - 0.5)));
  const si = toG(from.c + 0.5), sj = toG(from.r + 0.5);
  const gx = to.c + 0.5, gy = to.r + 0.5;

  const seen = new Uint8Array(M * M);
  const st = [];
  /* 起點是圓不是點時要多源播種。
     開關的第二階段就是這個情況：踩到開關的瞬間，球心可以在開關中心 SWITCH_R 內的任何位置，
     不是恰好落在那一個格點上。
     ⚠ 只取單一格點會出事：格點是 round(v/step-0.5) 量化出來的，在 step=0.1 時
       可能剛好落在離牆 0.45 的邊界上而被判成 blocked —— 於是明明走得通的關卡被判死。
       （實測就是這樣：同一關 step=0.05 判可解、step=0.1 判「start blocked」。） */
  if (opt.fromR) {
    const fx = from.c + 0.5, fy = from.r + 0.5;
    const i0 = Math.max(0, Math.floor((fx - opt.fromR) / step)), i1 = Math.min(M - 1, Math.ceil((fx + opt.fromR) / step));
    const j0 = Math.max(0, Math.floor((fy - opt.fromR) / step)), j1 = Math.min(M - 1, Math.ceil((fy + opt.fromR) / step));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const dx = (i + 0.5) * step - fx, dy = (j + 0.5) * step - fy;
      if (dx * dx + dy * dy >= opt.fromR * opt.fromR) continue;
      if (!free[idx(i, j)] || seen[idx(i, j)]) continue;
      seen[idx(i, j)] = 1; st.push([i, j]);
    }
    if (!st.length) return { ok: false, why: 'start blocked' };
  } else {
    if (!free[idx(si, sj)]) return { ok: false, why: 'start blocked' };
    seen[idx(si, sj)] = 1;
    st.push([si, sj]);
  }
  let reached = false, reach = 0;
  while (st.length) {
    const p = st.pop(), i = p[0], j = p[1];
    reach++;
    const dx = (i + 0.5) * step - gx, dy = (j + 0.5) * step - gy;
    if (dx * dx + dy * dy < toR * toR) reached = true;
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let k = 0; k < 4; k++) {
      const ni = i + nb[k][0], nj = j + nb[k][1];
      if (ni < 0 || nj < 0 || ni >= M || nj >= M) continue;
      if (seen[idx(ni, nj)] || !free[idx(ni, nj)]) continue;
      seen[idx(ni, nj)] = 1;
      st.push([ni, nj]);
    }
  }
  return { ok: reached, why: reached ? '' : 'goal unreachable', reach: reach };
}

/* 整關可解性。這是關卡「及格線」的單一真相 —— 生成器與 smoke test 都走這裡。
   有開關的關卡是兩階段問題，不是一次 flood fill 能回答的：
     ① 門關著時，球必須到得了開關
     ② 門開了之後，球必須從開關到得了終點
     ③ 門關著時終點必須到不了 —— 否則這道門是裝飾，玩家根本不用去踩開關 */
function levelSolvable(rows, step) {
  let sw = null;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (rows[r][c] === SWITCH) sw = { c, r };
  if (!sw) {
    const v = verifyLevel(rows, step);
    return { ok: v.ok, why: v.why, gated: false };
  }
  const p1 = verifyLevel(rows, step, { gateOpen: false, to: sw, toR: SWITCH_R });
  if (!p1.ok) return { ok: false, why: '門關著時到不了開關', gated: true };
  const p2 = verifyLevel(rows, step, { gateOpen: true, from: sw, fromR: SWITCH_R });
  if (!p2.ok) return { ok: false, why: '開門後從開關到不了終點', gated: true };
  if (verifyLevel(rows, step, { gateOpen: false }).ok) {
    return { ok: false, why: '門關著就能直達終點＝這道門是裝飾', gated: true };
  }
  return { ok: true, why: '', gated: true };
}

/* ══════════════ 遊戲流程 ══════════════ */
function resetBall() {
  ball.x = startCell.c + 0.5;
  ball.y = startCell.r + 0.5;
  ball.vx = 0; ball.vy = 0;
  accumulator = 0;
}
/* 哪些牆格貼著通道（含斜角）。每關算一次，畫面每幀都要用。
   斜角也算：不含斜角的話，轉角處會出現一格突兀的暗塊。 */
let wallEdge = new Uint8Array(N * N);
function computeWallEdge(g) {
  const m = new Uint8Array(N * N);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (g[r][c] !== WALL) continue;
    let edge = false;
    for (let dr = -1; dr <= 1 && !edge; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= N || nc >= N) continue;
      if (g[nr][nc] !== WALL) { edge = true; break; }
    }
    m[r * N + c] = edge ? 1 : 0;
  }
  return m;
}
// 這一關屬於第幾章（0-based）。CHAPTERS 是升冪的 from 索引表。
function chapterOf(lv) {
  let k = 0;
  for (let i = 0; i < CHAPTERS.length; i++) if (lv >= CHAPTERS[i].from) k = i;
  return k;
}
function startGame(idx) {
  level = Math.max(0, Math.min(LEVELS.length - 1, idx | 0));
  const p = parseLevel(LEVELS[level]);
  grid = p.grid;
  wallEdge = computeWallEdge(grid);
  startCell = p.start;
  goalCell = p.goal;
  switchCell = p.sw;
  elapsed = 0; fails = 0; anim = 0; fallAt = null;
  shake = 0; flash = 0; gateFlash = 0;
  gateOpen = false;
  nameShow = 0;
  readyT = 0;
  resetBall();
  // ⚠ 不直接進 playing。球在玩家還在讀關卡標題時就自己滾走，是「還沒開始就先掉一次」的來源。
  state = 'ready';
  hideOverlay();
}
// 放行：ready → playing。輕點畫面、按鍵、或明確地把手機傾下去都算。
function beginPlay() {
  if (state !== 'ready') return false;
  state = 'playing';
  nameShow = 1.4;             // 標題再淡出一下，讓玩家開球後還看得到這關在考什麼
  return true;
}
function loseBall(c, r) {
  fails++;
  fallAt = { x: c + 0.5, y: r + 0.5 };
  state = 'falling';
  anim = 0;
  shake = 0.4;
  sfxFall();
}
function winLevel() {
  fallAt = { x: goalCell.c + 0.5, y: goalCell.r + 0.5 };
  state = 'cleared';
  anim = 0;
  sfxClear();
  const key = String(level);
  if (times[key] === undefined || elapsed < times[key]) times[key] = Math.round(elapsed * 100) / 100;
  const s = starFor(fails);
  if (!stars[key] || s > stars[key]) stars[key] = s;
  if (level + 1 > cleared) cleared = level + 1;
  if (fails === 0 && level + 1 > perfects) perfects = level + 1;
  flash = 1;
  saveProgress();
}

/* ══════════════ 物理 ══════════════ */
function physStep(h) {
  const here = cellAt(ball.x, ball.y);

  // 踏上／離開地形的即時回饋。四個流向都歸成同一個 token，
  // 否則在流裡轉個彎（v→>）就會重新觸發一次音效。
  const terr = FLOW[here] ? '>' : ((here === '~' || here === ':') ? here : '.');
  if (terr !== terrainNow) { terrainNow = terr; sfxTerrain(terr); }

  // 1. 重力（由傾斜量決定）。加速度拆成「沿速度」與「垂直速度」兩個分量分別打折：
  //    冰上轉向能力只剩 12%，但推力還有 45% → 球直直衝出去、明知要轉卻轉不動。
  const drv = DRIVE[here] === undefined ? 1.0 : DRIVE[here];
  const trn = TURN[here] === undefined ? 1.0 : TURN[here];
  const ax = tiltX * GRAVITY, ay = tiltY * GRAVITY;
  const sp0 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp0 > 0.25 && drv !== trn) {
    const ux = ball.vx / sp0, uy = ball.vy / sp0;
    const along = ax * ux + ay * uy;               // 平行分量（加速／煞車）
    const px = ax - along * ux, py = ay - along * uy;  // 垂直分量（轉彎）
    ball.vx += (along * ux * drv + px * trn) * h;
    ball.vy += (along * uy * drv + py * trn) * h;
  } else {
    // 球幾乎靜止時沒有「速度方向」可分解，退回單一倍率
    ball.vx += ax * drv * h;
    ball.vy += ay * drv * h;
  }

  // 1b. 逆流：一個與傾斜無關的定向加速度。
  //     它不打折操控權威（那是 v7 走錯的路），而是直接吃掉玩家可用的傾斜額度：
  //     想往前就得把傾斜壓在前方，剩下能拿來左右修正的比例自然變少。
  const fl = FLOW[here];
  if (fl) { ball.vx += fl[0] * FLOW_ACCEL * h; ball.vy += fl[1] * FLOW_ACCEL * h; }

  // 2. 地形摩擦
  const fr = FRICTION[here];
  const damp = Math.exp(-(fr === undefined ? 0.55 : fr) * h);
  ball.vx *= damp; ball.vy *= damp;

  // 3. 速度上限 —— 這是防穿牆的核心，不是為了手感
  const sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (sp > MAX_SPEED) { ball.vx = ball.vx / sp * MAX_SPEED; ball.vy = ball.vy / sp * MAX_SPEED; }

  // 4. 位移（順便累積滾動相位，讓球看得出是在滾而不是在滑）
  const mx = ball.vx * h, my = ball.vy * h;
  ball.x += mx;
  ball.y += my;
  const moved = Math.sqrt(mx * mx + my * my);
  if (moved > 1e-9) {
    spin += moved / BALL_R;              // 滾過的弧長 / 半徑 = 轉過的角度
    spinX = mx / moved; spinY = my / moved;
  }

  // 5. 牆碰撞（圓 vs AABB，掃描珠子周圍格）
  const c0 = Math.floor(ball.x - BALL_R) - 1, c1 = Math.floor(ball.x + BALL_R) + 1;
  const r0 = Math.floor(ball.y - BALL_R) - 1, r1 = Math.floor(ball.y + BALL_R) + 1;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      if (!isWall(c, r)) continue;
      const nx = Math.max(c, Math.min(ball.x, c + 1));
      const ny = Math.max(r, Math.min(ball.y, r + 1));
      let dx = ball.x - nx, dy = ball.y - ny;
      let d2 = dx * dx + dy * dy;
      if (d2 >= BALL_R * BALL_R) continue;
      let ux, uy;
      if (d2 < 1e-12) {
        // 珠心落在牆格內（速度上限下不該發生）→ 朝離格中心最近的邊推出
        const ex = ball.x - (c + 0.5), ey = ball.y - (r + 0.5);
        if (Math.abs(ex) > Math.abs(ey)) { ux = ex >= 0 ? 1 : -1; uy = 0; }
        else { ux = 0; uy = ey >= 0 ? 1 : -1; }
        ball.x = c + 0.5 + ux * (0.5 + BALL_R);
        ball.y = r + 0.5 + uy * (0.5 + BALL_R);
      } else {
        const d = Math.sqrt(d2);
        ux = dx / d; uy = dy / d;
        ball.x = nx + ux * BALL_R;
        ball.y = ny + uy * BALL_R;
      }
      const vn = ball.vx * ux + ball.vy * uy;
      if (vn < 0) {
        if (vn < -1.2) sfxWall(-vn);     // 只有真的撞上去才出聲，擦過不算
        ball.vx -= (1 + RESTITUTION) * vn * ux;
        ball.vy -= (1 + RESTITUTION) * vn * uy;
      }
    }
  }

  // 6a. 開關：珠心壓過開關就永久開門（本關重玩才復位）。
  //     ⚠ 掉洞不會把門關回去 —— 繞去踩開關的路已經走過了，再罰一次只是磨耐性。
  //       失誤的代價由星等承擔（掉一次就拿不到三星），不必再疊一層重走。
  if (switchCell && !gateOpen) {
    const dx = ball.x - (switchCell.c + 0.5), dy = ball.y - (switchCell.r + 0.5);
    if (dx * dx + dy * dy < SWITCH_R * SWITCH_R) {
      gateOpen = true;
      gateFlash = 1;
      sfxSwitch();
    }
  }

  // 6. 洞判定（珠心進入洞口半徑就掉）
  const bc = Math.floor(ball.x), br = Math.floor(ball.y);
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const c = bc + dc, r = br + dr;
      const ch = cellCh(c, r);
      if (ch !== HOLE && ch !== GOAL) continue;
      const dx = ball.x - (c + 0.5), dy = ball.y - (r + 0.5);
      if (dx * dx + dy * dy >= HOLE_R * HOLE_R) continue;
      if (ch === GOAL) winLevel(); else loseBall(c, r);
      return;
    }
  }
}

function update(dt) {
  if (dt > 0.1) dt = 0.1;   // 分頁切回來時的大跳躍，不要一次補完

  // 傾斜平滑（鍵盤/拖曳輸入需要，陀螺儀本身已連續）
  const k = Math.min(1, dt * TILT_SMOOTH);
  tiltX += (targetTiltX - tiltX) * k;
  tiltY += (targetTiltY - tiltY) * k;

  // juice 衰減
  if (shake > 0) shake = Math.max(0, shake - dt * 1.7);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.9);
  if (nameShow > 0) nameShow = Math.max(0, nameShow - dt);
  if (gateFlash > 0) gateFlash = Math.max(0, gateFlash - dt * 0.9);

  if (state === 'ready') {
    readyT += dt;
    // 明確把手機傾下去也算開球 —— 傾斜玩家不必為了開始而先騰出一隻手去點螢幕
    if (Math.abs(targetTiltX) > 0.30 || Math.abs(targetTiltY) > 0.30) beginPlay();
    // ⚠ 放行的那一幀不能直接 return，否則那一幀的 dt 被吃掉，物理就跟幀率有關了
    if (state !== 'playing') return;
  }

  if (state === 'playing') {
    elapsed += dt;
    accumulator += dt;
    let n = 0;
    while (accumulator >= FIXED_DT && n < MAX_SUBSTEPS) {
      physStep(FIXED_DT);
      accumulator -= FIXED_DT;
      n++;
      if (state !== 'playing') { accumulator = 0; break; }
    }
    if (n >= MAX_SUBSTEPS) accumulator = 0;
  } else if (state === 'falling') {
    anim += dt;
    if (anim >= FALL_TIME) { resetBall(); state = 'playing'; anim = 0; fallAt = null; }
  } else if (state === 'cleared') {
    anim += dt;
    if (anim >= CLEAR_TIME) {
      if (level + 1 >= LEVELS.length) { state = 'finished'; showFinished(); }
      else { showCleared(); }
    }
  }
}

/* ══════════════ 輸入 ══════════════ */
function setTilt(ax, ay) {
  targetTiltX = Math.max(-1, Math.min(1, ax));
  targetTiltY = Math.max(-1, Math.min(1, ay));
}

// 依螢幕方向把 beta/gamma 換算成螢幕座標的傾斜
function orientationToTilt(beta, gamma, angle) {
  let ax, ay;
  if (angle === 90) { ax = beta; ay = -gamma; }
  else if (angle === 180) { ax = -gamma; ay = -beta; }
  else if (angle === 270 || angle === -90) { ax = -beta; ay = gamma; }
  else { ax = gamma; ay = beta; }
  return [ax, ay];
}
function screenAngle() {
  try {
    if (typeof screen !== 'undefined' && screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof orientation === 'number') return orientation;
  } catch (e) {}
  return 0;
}
function onOrientation(e) {
  if (e.beta === null || e.gamma === null) return;
  lastBeta = e.beta; lastGamma = e.gamma;
  if (calBeta === null) { calBeta = e.beta; calGamma = e.gamma; }
  const t = orientationToTilt(e.beta - calBeta, e.gamma - calGamma, screenAngle());
  const nx = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, t[0] * sens)) / MAX_TILT_DEG;
  const ny = Math.max(-MAX_TILT_DEG, Math.min(MAX_TILT_DEG, t[1] * sens)) / MAX_TILT_DEG;
  controlMode = 'tilt';
  setTilt(nx, ny);
}
function recalibrate() { calBeta = lastBeta; calGamma = lastGamma; setTilt(0, 0); tiltX = 0; tiltY = 0; }

function keyTilt() {
  if (controlMode === 'tilt') return;
  const l = keys['ArrowLeft'] || keys['a'] || keys['A'];
  const r = keys['ArrowRight'] || keys['d'] || keys['D'];
  const u = keys['ArrowUp'] || keys['w'] || keys['W'];
  const dn = keys['ArrowDown'] || keys['s'] || keys['S'];
  setTilt((r ? 1 : 0) - (l ? 1 : 0), (dn ? 1 : 0) - (u ? 1 : 0));
}

/* ══════════════ 畫面 ══════════════ */
const cv = document.getElementById('cv');
const ctx = cv ? cv.getContext('2d') : null;
let W = 800, H = 600, board = 400, ox = 0, oy = 0, cellPx = 26;
let safeT = 0, safeB = 0;     // 瀏海／Home indicator 讓出來的高度
let hudTop = 0;               // HUD 那一列的中心 y

/* 安全區高度沒有辦法直接從 JS 讀 env()。
   放一個看不見的探針元素、用 CSS 把 env() 寫進它的 padding，再量它的實際高度。
   ⚠ 少了這段，iPhone 在 PWA 全螢幕模式下的 HUD 會直接被瀏海／動態島吃掉。 */
function readSafeInsets() {
  const t = document.getElementById('sa-t'), b = document.getElementById('sa-b');
  safeT = (t && t.offsetHeight) || 0;
  safeB = (b && b.offsetHeight) || 0;
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth || 800;
  H = window.innerHeight || 600;
  if (cv) {
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    if (ctx && ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  readSafeInsets();
  const pad = 12;
  hudTop = safeT + 26;
  const hud = safeT + 56, bottom = safeB + 52;
  board = Math.max(120, Math.min(W - pad * 2, H - hud - bottom - pad * 2));
  ox = Math.round((W - board) / 2);
  // 重心偏上：手機直式時剩餘空間 1/3 給上方、2/3 留給下方持機的手，免得拇指擋住盤面
  oy = Math.round(hud + Math.max(pad, (H - hud - bottom - board) * 0.34));
  cellPx = board / N;
  layoutHud();
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return m > 0 ? m + ':' + (s < 10 ? '0' : '') + s.toFixed(1) : s.toFixed(1) + 's';
}
// 星星用實心／空心兩種字元，不用顏色區分 —— 顏色在小尺寸下辨識度差，形狀不會。
function starStr(n) { return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3 - n); }

function draw() {
  if (!ctx) return;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  if (!grid) return;

  // 盤面隨傾斜輕微位移，讓「盤子在傾斜」這件事看得見；掉洞時疊加震動
  let shx = tiltX * 5, shy = tiltY * 5;
  if (shake > 0) {
    const amp = shake * 13;
    shx += (Math.random() * 2 - 1) * amp;
    shy += (Math.random() * 2 - 1) * amp;
  }

  ctx.save();
  ctx.translate(ox + shx, oy + shy);

  // 盤底：單一實色。夠亮讓路徑清楚、夠沉不刺眼，暖灰不是慘白。
  ctx.fillStyle = C.board;
  ctx.fillRect(0, 0, board, board);

  /* 逐格填色時必須對齊像素邊界再畫。
     cellPx 通常不是整數（例如 410/19 ≈ 21.58），直接 fillRect 會在每格邊緣留下
     半透明的抗鋸齒縫 → 整片牆看起來爬滿格線，像試算表。這是廉價感的來源之一。 */
  const cellRect = (c, r) => {
    const x0 = Math.floor(c * cellPx), y0 = Math.floor(r * cellPx);
    ctx.fillRect(x0, y0, Math.ceil((c + 1) * cellPx) - x0, Math.ceil((r + 1) * cellPx) - y0);
  };

  // 地形。對比刻意拉高：地形換了玩家要一眼看見，
  // 否則「剎不住」會被當成 bug 而不是設計。實色色塊，不做反光也不做顆粒。
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const ch = grid[r][c];
      if (ch === ICE) { ctx.fillStyle = C.ice; cellRect(c, r); }
      else if (ch === SAND) { ctx.fillStyle = C.sand; cellRect(c, r); }
      else if (FLOW[ch]) { ctx.fillStyle = C.flow; cellRect(c, r); }
    }
  }

  /* 逆流的方向箭頭。
     這不是紋理，是**標示**：玩家在進入之前就必須知道流往哪邊，才有可能提前壓住傾斜。
     位置由格座標決定（不是亂數），所以每幀都在同一個地方，不會變成閃爍的雜訊。
     用一個開口朝向流向的 V 字，比實心三角更輕、也不會蓋掉底下的球。 */
  ctx.strokeStyle = C.flowArw;
  ctx.lineWidth = Math.max(1.4, cellPx * 0.10);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const d = FLOW[grid[r][c]];
      if (!d) continue;
      const x = (c + 0.5) * cellPx, y = (r + 0.5) * cellPx, s = cellPx * 0.24;
      // 沿流向前進 s、左右各退 s 畫成 V
      const px = -d[1], py = d[0];        // 垂直於流向
      ctx.beginPath();
      ctx.moveTo(x - d[0] * s + px * s, y - d[1] * s + py * s);
      ctx.lineTo(x + d[0] * s, y + d[1] * s);
      ctx.lineTo(x - d[0] * s - px * s, y - d[1] * s - py * s);
      ctx.stroke();
    }
  }

  // 牆（陰影方向跟著傾斜，強化立體感）
  /* 牆：單一實色，就這樣。
     ⚠ 不要偽 3D 側壁、不要頂部高光、不要格線、不要漸層。
       v7 加每格亮邊 → 看起來像廉價磚牆；v8 加 forced perspective 側壁 → 更廉價。
       兩次都是同一個毛病：**用擬真效果冒充質感**。這個遊戲的定位是簡單平面，
       克制才是功力（Gary 對其他作品也是這個偏好）。 */
  /* 牆分兩層畫：**貼著通道的牆**用牆色，**完全被包在裡面的實心區**用更暗的填充色。
     這不是裝飾，是資訊層級：只有貼著通道的那一圈牆會影響球，深處的實心區玩家永遠碰不到。
     全部塗成同一個深色的話，稀疏的關卡（例如第 1 關）整面盤子看起來就是一大塊死黑，
     迷宮的形狀被淹掉。分開之後，路徑是圖、實心區是地，關卡越後面越密的差異也才看得出來。
     ⚠ 兩個都是實色。這不是漸層、不是陰影、不是偽 3D。 */
  ctx.fillStyle = C.bulk;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] !== WALL || wallEdge[r * N + c]) continue;
    cellRect(c, r);
  }
  ctx.fillStyle = C.wall;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] !== WALL || !wallEdge[r * N + c]) continue;
    cellRect(c, r);
  }

  /* 門與開關。
     兩者同色，而且是盤面上唯一的紫 —— 玩家不必被文字教學，看顏色就知道這兩個東西是一組的。
     關著＝實心擋住通道；開了＝只剩兩條細邊框，讓人看得出「這裡本來有一道門」。 */
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] !== GATE) continue;
    if (!gateOpen) { ctx.fillStyle = C.gate; cellRect(c, r); }
    else {
      const x0 = Math.floor(c * cellPx), y0 = Math.floor(r * cellPx);
      const w = Math.ceil((c + 1) * cellPx) - x0, h = Math.ceil((r + 1) * cellPx) - y0;
      const t = Math.max(2, cellPx * 0.16);
      ctx.fillStyle = C.gateOpen;
      /* 門開了：門框留在「門原本嵌在牆上」的那幾條邊。
         ⚠ 不能用格子的長寬去猜方向 —— 每一格都接近正方形，猜出來的方向對一半錯一半。
           正確的判準是看哪一邊貼著牆：門是嵌在牆上的，門框當然留在牆那一側。 */
      if (cellCh(c, r - 1) === WALL) ctx.fillRect(x0, y0, w, t);
      if (cellCh(c, r + 1) === WALL) ctx.fillRect(x0, y0 + h - t, w, t);
      if (cellCh(c - 1, r) === WALL) ctx.fillRect(x0, y0, t, h);
      if (cellCh(c + 1, r) === WALL) ctx.fillRect(x0 + w - t, y0, t, h);
    }
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] !== SWITCH) continue;
    const x = (c + 0.5) * cellPx, y = (r + 0.5) * cellPx, rad = SWITCH_R * cellPx;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
    if (gateOpen) { ctx.fillStyle = C.gate; ctx.fill(); }      // 踩過了＝實心
    else { ctx.lineWidth = Math.max(2, cellPx * 0.16); ctx.strokeStyle = C.gate; ctx.stroke(); }
  }

  // 洞
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const ch = grid[r][c];
      if (ch !== HOLE && ch !== GOAL) continue;
      const x = (c + 0.5) * cellPx, y = (r + 0.5) * cellPx, rad = HOLE_R * cellPx;
      if (ch === GOAL) {
        // 終點：同樣是實心圓，靠一圈亮色環跟陷阱區分
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fillStyle = C.hole; ctx.fill();
        ctx.lineWidth = Math.max(2, cellPx * 0.13);
        ctx.strokeStyle = C.goal; ctx.stroke();
      } else {
        // 洞：實心圓，不做漸層深度。形狀和顏色已經足以表達「這裡不能碰」。
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fillStyle = C.hole; ctx.fill();
      }
    }
  }

  // 珠子
  let bx = ball.x * cellPx, by = ball.y * cellPx, br = BALL_R * cellPx;
  let alpha = 1;
  if (state === 'falling' && fallAt) {
    const t = Math.min(1, anim / FALL_TIME);
    bx = fallAt.x * cellPx; by = fallAt.y * cellPx;
    br = BALL_R * cellPx * (1 - t * 0.85);
    alpha = 1 - t * 0.7;
  } else if (state === 'cleared' && fallAt) {
    const t = Math.min(1, anim / CLEAR_TIME);
    bx = fallAt.x * cellPx; by = fallAt.y * cellPx;
    br = BALL_R * cellPx * (1 - t * 0.8);
    alpha = 1 - t * 0.5;
  }
  if (br > 0.4) {
    ctx.globalAlpha = alpha;
    // 球踩在冰上時罩一層藍光 —— 「現在轉不動」要是看得見的狀態，不是只能用猜的
    // 球：實色圓 + 一個固定的小高光點。不做徑向漸層、不做投影、不做冰上光暈。
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fillStyle = C.ball; ctx.fill();
    ctx.beginPath();
    ctx.arc(bx - br * 0.30, by - br * 0.30, br * 0.26, 0, Math.PI * 2);
    ctx.fillStyle = C.ballHi; ctx.fill();

    ctx.globalAlpha = 1;
  }

  // 盤框
  ctx.lineWidth = 3; ctx.strokeStyle = C.frame;
  ctx.strokeRect(0, 0, board, board);
  ctx.restore();

  if (state !== 'menu') drawHud();

  // 過關閃光
  if (flash > 0) {
    ctx.fillStyle = 'rgba(232,185,58,' + (flash * 0.20).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'ready') drawReady();
}

const FONT = '-apple-system,BlinkMacSystemFont,system-ui,"Noto Sans TC","PingFang TC",sans-serif';

/* HUD 的排法有理由，不是隨手擺的：
   · 星等放右上（最顯眼的角落）—— 這遊戲的貨幣是「穩」，星等才是玩家真正在追的東西
   · 計時放下方、而且是暗色 —— 明確不做限時（Gary 定調），碼表不該搶注意力，
     但拿掉又會少一個回顧自己有沒有進步的依據，所以留著、降級
   · 暫停鍵是 DOM 元素不是畫在 canvas 上（見 layoutHud），這樣才有真的可點區域 */
function drawHud() {
  const cs = starFor(fails);
  ctx.textBaseline = 'middle';

  // 左：關卡編號 + 這關在考什麼
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f2ece0';
  ctx.font = '600 16px ' + FONT;
  const lx = 62;                       // 讓開左上角的暫停鍵
  ctx.fillText(String(level + 1).padStart(2, '0'), lx, hudTop);
  ctx.fillStyle = '#a1937c';
  ctx.font = '13px ' + FONT;
  ctx.fillText(LEVEL_NAMES[level] || '', lx + 26, hudTop + 1);

  // 右：星等。掉星是即時的，玩家掉一次就馬上看到少一顆 → 立刻有重來的動機
  ctx.textAlign = 'right';
  ctx.font = '15px ' + FONT;
  ctx.fillStyle = cs === 3 ? '#e8b93a' : (cs === 2 ? '#a1937c' : '#d9705c');
  ctx.fillText(starStr(cs), W - 18, hudTop);

  // 下：計時與最佳（次要資訊）
  ctx.textAlign = 'center';
  ctx.font = '13px ' + FONT;
  ctx.fillStyle = '#8b7f6b';
  const best = times[String(level)];
  ctx.fillText(fmtTime(elapsed) + (best !== undefined ? '　·　最佳 ' + fmtTime(best) : ''),
    W / 2, H - safeB - 30);
  ctx.font = '11px ' + FONT;
  ctx.fillStyle = '#6d624f';
  const modeTxt = controlMode === 'tilt' ? '傾斜手機' : (controlMode === 'drag' ? '拖曳畫面' : '方向鍵 / WASD');
  ctx.fillText(modeTxt, W / 2, H - safeB - 13);

  // 踩到開關的提示。門常常在畫面另一頭，不講一聲玩家不知道剛才發生了什麼事。
  if (gateFlash > 0) {
    ctx.globalAlpha = Math.min(1, gateFlash * 1.6);
    ctx.textAlign = 'center';
    ctx.font = '600 15px ' + FONT;
    ctx.fillStyle = C.gateOpen;
    ctx.fillText('門開了', W / 2, oy - 16);
    ctx.globalAlpha = 1;
  } else if (nameShow > 0) {
    ctx.globalAlpha = Math.min(1, nameShow / 0.5);
    ctx.textAlign = 'center';
    ctx.font = '600 15px ' + FONT;
    ctx.fillStyle = '#e8b93a';
    ctx.fillText(CHAPTERS[chapterOf(level)].name + '　·　' + (LEVEL_NAMES[level] || ''), W / 2, oy - 16);
    ctx.globalAlpha = 1;
  }
}

/* ready：球已就位但還沒放行。
   沒有這一屏，球會在玩家還在看「這關是什麼」的時候就自己滾走 —— 開局先掉一次，
   那不是難度是漏設計。盤面照常畫在後面，玩家可以先看清楚地形再開球。 */
function drawReady() {
  /* ⚠ 卡片不壓在盤面上。
     ready 的用途就是讓玩家先把地形看清楚 —— 把字蓋在迷宮上等於自己拆自己的台。
     盤面下方本來就有一塊空白（重心刻意偏上，留給持機的手），字放那裡。
     只有在那塊空白不夠高（橫式／小視窗）時，才退回蓋在盤面中央並加一層壓暗。 */
  const below = H - safeB - 46 - (oy + board);
  const roomy = below >= 132;
  let y;
  if (roomy) {
    y = oy + board + (below - 132) * 0.42 + 26;
  } else {
    ctx.fillStyle = 'rgba(21,18,13,0.62)';
    ctx.fillRect(0, 0, W, H);
    y = oy + board / 2 - 40;
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const ch = CHAPTERS[chapterOf(level)];
  ctx.font = '600 11px ' + FONT;
  ctx.fillStyle = '#8b7f6b';
  ctx.fillText('第 ' + (chapterOf(level) + 1) + ' 章　' + ch.name, W / 2, y);

  ctx.font = '700 25px ' + FONT;
  ctx.fillStyle = '#f2ece0';
  ctx.fillText(LEVEL_NAMES[level] || ('第 ' + (level + 1) + ' 關'), W / 2, y + 32);

  ctx.font = '13px ' + FONT;
  ctx.fillStyle = '#a1937c';
  ctx.fillText('第 ' + (level + 1) + ' 關　·　' + starStr(stars[String(level)] || 0), W / 2, y + 62);

  // 呼吸的提示字：靜止的畫面需要一個動的東西，玩家才知道遊戲在等他而不是卡住了
  const pulse = 0.55 + 0.45 * Math.sin(readyT * 3.0);
  ctx.globalAlpha = pulse;
  ctx.font = '600 15px ' + FONT;
  ctx.fillStyle = '#e8b93a';
  ctx.fillText(controlMode === 'tilt' ? '傾斜手機開始' : '輕點畫面開始', W / 2, y + 106);
  ctx.globalAlpha = 1;
}

/* ══════════════ 疊層 UI ══════════════ */
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');

const hudbar = document.getElementById('hudbar');
// 遊戲中才顯示暫停鍵；選單與過關畫面上它只會擋到東西
function layoutHud() {
  if (!hudbar) return;
  const show = state === 'ready' || state === 'playing' || state === 'falling';
  hudbar.classList[show ? 'remove' : 'add']('hidden');
}
function showOverlay(html) {
  if (!panel || !overlay) return;
  panel.innerHTML = html;
  overlay.classList.remove('hidden');
  layoutHud();
}
function hideOverlay() { if (overlay) overlay.classList.add('hidden'); layoutHud(); }

function starsIn(from, to) {
  let t = 0;
  for (let i = from; i < to; i++) t += stars[String(i)] || 0;
  return t;
}
function chapterEnd(k) { return k + 1 < CHAPTERS.length ? CHAPTERS[k + 1].from : LEVELS.length; }

/* 選關依章節分組。每章顯示自己的 ★ 進度 ——
   「這一章我還差 2 顆」比「全部還差 41 顆」是小得多、也具體得多的目標。 */
function levelGrid() {
  let h = '';
  for (let k = 0; k < CHAPTERS.length; k++) {
    const from = CHAPTERS[k].from, to = chapterEnd(k);
    const locked = from > cleared;
    h += '<div class="chap' + (locked ? ' lock' : '') + '">' +
      '<div class="chap-h"><span class="chap-n">第 ' + (k + 1) + ' 章</span>' +
      '<span class="chap-t">' + CHAPTERS[k].name + '</span>' +
      '<span class="chap-s">' + (locked ? '' : '★ ' + starsIn(from, to) + '/' + ((to - from) * 3)) + '</span></div>' +
      '<div class="grid">';
    for (let i = from; i < to; i++) {
      const lock = i > cleared;
      const st = stars[String(i)] || 0;
      const cls = lock ? 'lv lock' : (st === 3 ? 'lv perfect' : (st > 0 ? 'lv done' : 'lv'));
      h += '<button class="' + cls + '"' + (lock ? ' disabled' : ' data-act="play" data-lv="' + i + '"') + '>' +
        (i + 1) + '<span class="st">' + (st ? '★'.repeat(st) : '') + '</span></button>';
    }
    h += '</div></div>';
  }
  return h;
}

function progressBar() {
  const max = LEVELS.length * 3, got = totalStars();
  return '<div class="prog"><i style="width:' + Math.round(got / max * 100) + '%"></i></div>' +
    '<div class="progtx"><span>★ ' + got + ' / ' + max + '</span><span>' +
    Math.min(cleared, LEVELS.length) + ' / ' + LEVELS.length + ' 關</span></div>';
}

function showTitle() {
  state = 'menu';
  const started = cleared > 0;
  const wiped = progressWiped;
  progressWiped = false;              // 只提示一次，之後回主畫面不再重複
  showOverlay(
    '<h1>迷宮球</h1><div class="sub">tilt maze</div>' +
    (wiped ? '<div class="sp"></div><div class="msg" style="color:var(--gold);border:1px solid #4a3f1c;border-radius:var(--r);padding:14px">關卡已全面改版：' + LEVELS.length + ' 關、六個章節，新增逆流與開關兩種機制。\n舊進度不適用，已從第 1 關重新開始。</div>' : '') +
    '<div class="sp"></div>' +
    (started ? progressBar() + '<div class="sp"></div>'
             : '<div class="msg">傾斜手機，把金珠滾進<span style="color:var(--gold)">金色終點洞</span>。\n穩住手，別讓它掉進黑洞。</div><div class="sp"></div>') +
    '<button class="primary" data-act="start">' + (started ? '繼續第 ' + Math.min(cleared + 1, LEVELS.length) + ' 關' : '開始遊戲') + '</button>' +
    (started ? '<button data-act="levels">選擇關卡</button>' : '') +
    '<button data-act="howto">怎麼玩</button>' +
    '<button class="ghost" data-act="settings">設定</button>' +
    '<div class="note">' + APP_VERSION + ' · 關卡 v' + LEVELS_VERSION + '</div>',
  );
}
function showLevels() {
  showOverlay('<h1>選擇關卡</h1><div class="sub">select level</div>' +
    '<div class="sp-s"></div>' + progressBar() + '<div class="sp"></div>' +
    levelGrid() +
    '<div class="note">★★★ 無失誤　★★ 失誤 2 次內　★ 完成</div>' +
    '<button class="ghost" data-act="title">返回</button>');
}
/* 「怎麼玩」是獨立一屏，不是塞在主畫面的一段小字。
   有了逆流跟開關兩個新機制之後，光靠顏色自己看懂的成本太高 ——
   但也不做強制教學：想看的人才點進來，不擋在開始遊戲前面。 */
function showHowTo() {
  const lg = (col, t, d) => '<div class="lg"><s style="background:' + col + '"></s><span>' +
    '<b style="color:var(--text);font-weight:600">' + t + '</b>　' + d + '</span></div>';
  showOverlay('<h1>怎麼玩</h1><div class="sub">how to play</div><div class="sp"></div>' +
    '<div class="msg" style="margin-bottom:18px">傾斜手機控制盤面。球不會自己停 —— 要停下來得往反方向傾。</div>' +
    '<div class="legend">' +
    lg(C.goal, '金圈洞', '終點，滾進去就過關') +
    lg(C.hole, '黑洞', '掉下去回起點，並少一顆星') +
    lg(C.ice, '冰', '摩擦幾乎為零，速度會自己越堆越高') +
    lg(C.sand, '沙', '很黏，衝進去馬上失速') +
    lg(C.flow, '逆流', '順著箭頭推你，得一直往前壓住傾斜') +
    lg(C.gate, '門與開關', '同色成對。踩到開關，那道門才會開') +
    '</div>' +
    '<div class="note">★★★ 無失誤　★★ 失誤 2 次內　★ 完成。<br>不計時，所以評的是穩不是快。<br><br>' +
    'iPhone / Android 第一次開始會請求動作感測器權限；<br>電腦上用方向鍵或滑鼠拖曳。</div>' +
    '<button class="ghost" data-act="title">返回</button>');
}
function showSettings() {
  showOverlay('<h1>設定</h1><div class="sub">settings</div><div class="sp"></div>' +
    '<div class="row"><span>靈敏度</span><input type="range" id="sens" min="0.4" max="2.2" step="0.1" value="' + sens + '"><b id="sensv">' + sens.toFixed(1) + '</b></div>' +
    '<button data-act="recal">把目前姿勢設為水平</button>' +
    '<div class="note">拿著手機的角度不會是完全水平。覺得球一直往同一邊跑，就按上面那顆重新校正。</div>' +
    '<button data-act="sfx">音效　' + (sfxOn ? '開' : '關') + '</button>' +
    '<button data-act="update">檢查更新（' + APP_VERSION + '）</button>' +
    '<div class="sp-s"></div>' +
    (cleared > 0
      ? '<button data-act="reset" class="' + (resetArmed ? 'danger' : 'ghost') + '">' +
        (resetArmed ? '再按一次，' + cleared + ' 關進度與 ★' + totalStars() + ' 會全部清掉' : '重新開始（清除進度）') + '</button>' +
        (resetArmed ? '<button class="ghost" data-act="settings">取消</button>' : '')
      : '<div class="note">目前沒有進度可清除。</div>') +
    '<button class="ghost" data-act="title">返回</button>');
  const el = document.getElementById('sens');
  if (el && el.addEventListener) el.addEventListener('input', function () {
    sens = parseFloat(el.value) || 1;
    lsSet('maze_sens', sens);
    const v = document.getElementById('sensv');
    if (v) v.textContent = sens.toFixed(1);
  });
}
function showCleared() {
  state = 'menu';
  const best = times[String(level)];
  const got = starFor(fails);
  const hint = got === 3 ? '三星達成' : (got === 2 ? '無失誤就有第三顆星' : '失誤 2 次以內可拿兩星');
  // 章末給一個小結：章節是這版新增的結構，走完一章要讓玩家感覺到「一段結束了」
  const k = chapterOf(level);
  const endOfChapter = level + 1 === chapterEnd(k) && level + 1 < LEVELS.length;
  showOverlay('<div class="big">' + '★'.repeat(got) + '<span style="color:#3a3227">' + '★'.repeat(3 - got) + '</span></div>' +
    '<div class="sub">第 ' + (level + 1) + ' 關 · ' + (LEVEL_NAMES[level] || '') + '</div>' +
    '<div class="sp"></div>' +
    '<div class="msg">' + (fails === 0 ? '無失誤' : '失誤 ' + fails + ' 次') + '　用時 ' + fmtTime(elapsed) +
    (best !== undefined && best < elapsed ? '\n最佳 ' + fmtTime(best) : '') + '\n' + hint + '</div>' +
    (endOfChapter
      ? '<div class="sp"></div><div class="msg" style="color:var(--gold)">第 ' + (k + 1) + ' 章「' + CHAPTERS[k].name +
        '」完成　★ ' + starsIn(CHAPTERS[k].from, chapterEnd(k)) + '/' + ((chapterEnd(k) - CHAPTERS[k].from) * 3) +
        '\n下一章：' + CHAPTERS[k + 1].name + ' —— ' + CHAPTERS[k + 1].sub + '</div>'
      : '') +
    '<div class="sp"></div>' +
    '<button class="primary" data-act="next">下一關</button>' +
    '<button data-act="retry">重玩本關</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}
function showFinished() {
  state = 'menu';
  const full = totalStars() >= LEVELS.length * 3;
  showOverlay('<div class="big">全 ' + LEVELS.length + ' 關通關</div><div class="sub">tilt maze cleared</div>' +
    '<div class="sp"></div>' + progressBar() + '<div class="sp"></div>' +
    '<div class="msg">' + (full ? '全三星。這盤你已經摸透了。' : '還有星星沒拿到 —— 無失誤才是三星。') + '</div>' +
    '<div class="sp"></div>' +
    '<button class="primary" data-act="levels">回頭補星</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}
function showPaused() {
  showOverlay('<h1>暫停</h1><div class="sub">第 ' + (level + 1) + ' 關 · ' + (LEVEL_NAMES[level] || '') + '</div>' +
    '<div class="sp"></div>' +
    '<button class="primary" data-act="resume">繼續</button>' +
    '<button data-act="retry">重玩本關</button>' +
    '<button data-act="recal">重新校正水平</button>' +
    '<button class="ghost" data-act="title">回主畫面</button>');
}

/* ══════════════ 感測器權限 ══════════════ */
function enableTilt() {
  // iOS 13+ 必須在使用者手勢裡呼叫；拒絕或不支援就退回拖曳操作
  try {
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      return DOE.requestPermission().then(function (res) {
        if (res === 'granted') { window.addEventListener('deviceorientation', onOrientation); controlMode = 'tilt'; }
        else controlMode = 'drag';
      }).catch(function () { controlMode = 'drag'; });
    }
    if (DOE) { window.addEventListener('deviceorientation', onOrientation); }
  } catch (e) {}
  return Promise.resolve();
}

/* ══════════════ 強制更新 ══════════════
   最後手段：砍掉所有快取、註銷 sw，再用帶時戳的網址重載。
   給「重開好幾次還是舊版」的情況用 —— 玩家不該需要去系統設定清網站資料。 */
function forceUpdate() {
  const done = function () {
    const u = location.origin + location.pathname + '?u=' + Date.now();
    location.replace(u);
  };
  try {
    const jobs = [];
    if (typeof caches !== 'undefined' && caches.keys) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (!jobs.length) return done();
    Promise.all(jobs).then(done, done);
    setTimeout(done, 2500);        // 卡住也要走
  } catch (e) { done(); }
}

/* ══════════════ 事件 ══════════════ */
function act(a, el) {
  initAudio();                          // 必須在使用者手勢裡啟動，iOS 才給聲音
  // 離開「重新開始」按鈕就解除待確認狀態，避免下次進設定還停在危險狀態
  if (a !== 'reset') resetArmed = false;
  if (a === 'start') { enableTilt(); startGame(Math.min(cleared, LEVELS.length - 1)); }
  else if (a === 'play') { enableTilt(); startGame(parseInt(el.getAttribute('data-lv'), 10) || 0); }
  else if (a === 'levels') showLevels();
  else if (a === 'settings') showSettings();
  else if (a === 'howto') showHowTo();
  else if (a === 'title') showTitle();
  else if (a === 'pause') { if (state === 'playing' || state === 'ready') { state = 'paused'; showPaused(); } }
  else if (a === 'next') startGame(Math.min(level + 1, LEVELS.length - 1));
  else if (a === 'retry') startGame(level);
  else if (a === 'resume') { state = 'playing'; hideOverlay(); }
  else if (a === 'recal') { recalibrate(); }
  else if (a === 'sfx') { sfxOn = !sfxOn; lsSet('maze_sfx', sfxOn ? '1' : '0'); if (sfxOn) tone(660, 0.1, 'triangle', 0.12); showSettings(); }
  else if (a === 'reset') {
    if (!resetArmed) { resetArmed = true; showSettings(); }        // 第一次只是舉起，不動資料
    else { resetProgress(); resetArmed = false; showTitle(); }     // 再按一次才真的清
  }
  else if (a === 'update') forceUpdate();
}

function bindEvents() {
  if (overlay && overlay.addEventListener) {
    overlay.addEventListener('click', function (e) {
      let t = e.target;
      while (t && t !== overlay && !t.getAttribute?.('data-act')) t = t.parentNode;
      const a = t && t.getAttribute ? t.getAttribute('data-act') : null;
      if (a) act(a, t);
    });
  }
  // 手機上唯一的遊戲中按鍵。v9 以前只有鍵盤 P，手機玩家根本沒辦法暫停。
  const pauseBtn = document.getElementById('pause');
  if (pauseBtn && pauseBtn.addEventListener) {
    pauseBtn.addEventListener('click', function (e) {
      if (e.stopPropagation) e.stopPropagation();
      act('pause', pauseBtn);
    });
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    // iOS 轉向時 innerHeight 常常晚一拍才對，visualViewport 比較準
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (state === 'playing' || state === 'ready') { state = 'paused'; showPaused(); }
      else if (state === 'paused') { state = 'playing'; hideOverlay(); }
    } else if (state === 'ready') { initAudio(); beginPlay(); }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0 && e.preventDefault) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  // 拖曳操作（電腦滑鼠 / 沒有感測器權限的手機）
  let dragging = false;
  function pt(e) {
    const t = (e.touches && e.touches[0]) || e;
    return { x: t.clientX, y: t.clientY };
  }
  function dragTo(e) {
    if (!dragging || controlMode === 'tilt') return;
    const p = pt(e);
    const cx = ox + board / 2, cy = oy + board / 2;
    const rad = board / 2;
    controlMode = 'drag';
    setTilt(((p.x - cx) / rad) * sens, ((p.y - cy) / rad) * sens);
  }
  // ready 狀態下第一次碰畫面＝開球。桌機同一次按下要能直接接著拖曳，
  // 不然玩家得放開再按一次才動得了盤子。
  function down(e) {
    if (state === 'ready') { initAudio(); beginPlay(); }
    dragging = true; dragTo(e);
  }
  function up() { dragging = false; if (controlMode === 'drag') setTilt(0, 0); }
  if (cv && cv.addEventListener) {
    cv.addEventListener('mousedown', down);
    cv.addEventListener('mousemove', dragTo);
    cv.addEventListener('touchstart', function (e) { down(e); if (e.preventDefault) e.preventDefault(); }, { passive: false });
    cv.addEventListener('touchmove', function (e) { dragTo(e); if (e.preventDefault) e.preventDefault(); }, { passive: false });
    cv.addEventListener('touchend', up);
  }
  window.addEventListener('mouseup', up);
  window.addEventListener('blur', function () { dragging = false; if (state === 'playing') { state = 'paused'; showPaused(); } });
}

/* ══════════════ 主迴圈 ══════════════ */
let lastT = 0;
function frame(t) {
  const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
  lastT = t;
  keyTilt();
  if (state === 'menu') {
    /* 主畫面背後的盤子緩慢擺動。
       這不是裝飾：標題畫面在教「這個遊戲是傾斜盤子」，一張靜止的圖說不出這件事。
       幅度刻意小（±0.18），只是呼吸，不是在演。 */
    menuT += dt;
    tiltX = Math.sin(menuT * 0.55) * 0.18;
    tiltY = Math.cos(menuT * 0.41) * 0.18;
  } else if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}

function init() {
  resize();
  bindEvents();
  grid = parseLevel(LEVELS[0]).grid;   // 讓標題畫面背後有東西可看
  wallEdge = computeWallEdge(grid);
  showTitle();
  requestAnimationFrame(frame);
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    // updateViaCache:'none' —— 不讓瀏覽器快取 sw.js 本身，否則新版 sw 永遠裝不上，
    // 玩家會一直被舊 sw 服務舊 HTML（v5 就是這樣卡住的）。
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      try { reg.update(); } catch (e) {}
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          // 新版裝好且目前已有 controller（代表是「更新」不是首次安裝）→ 自動換上新版
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            location.reload();
          }
        });
      });
    }).catch(function () {});
  }
}
init();
</script>
